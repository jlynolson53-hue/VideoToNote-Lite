name: Build Uploader App

on:
  push:
    paths:
      - ".github/workflows/uploader.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate project
        shell: bash
        run: |
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'EOF_S'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BuildUploader"
          include ":app"
          EOF_S
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'EOF_R'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_R
          printf 'org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=false\n' > gradle.properties
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'EOF_A'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.vtn.uploader'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.vtn.uploader'
                  minSdk 24
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv("RUN_NO") ?: "1")
                  versionName "1.0." + (System.getenv("RUN_NO") ?: "1")
              }
              signingConfigs {
                  release {
                      storeFile rootProject.file('up.jks')
                      storePassword 'uploader123'
                      keyAlias 'up'
                      keyPassword 'uploader123'
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              lint { checkReleaseBuilds false; abortOnError false }
          }
          EOF_A
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_M'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <package android:name="com.vtn.lite" />
              </queries>
              <application android:label="build助手" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".BuildService" android:exported="false" android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF_M
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_fg.xml')"
          cat > 'app/src/main/res/drawable/ic_fg.xml' <<'EOF_I'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#FFFFFF" android:pathData="M50,28h8v26h-8z"/>
          <path android:fillColor="#FFFFFF" android:pathData="M38,48L54,66L70,48Z"/>
          <path android:strokeColor="#FFFFFF" android:strokeWidth="7" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M35,64V76H73V64"/>
          <path android:fillColor="#34D399" android:pathData="M76,32m-5,0a5,5 0,1 1,10 0a5,5 0,1 1,-10 0"/>
          </vector>
          EOF_I
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_bg.xml')"
          cat > 'app/src/main/res/drawable/ic_bg.xml' <<'EOF_I'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#111111" android:pathData="M0,0h108v108h-108z"/>
          <path android:fillColor="#1F1F1F" android:pathData="M0,0h108v54h-108z"/>
          </vector>
          EOF_I
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_mono.xml')"
          cat > 'app/src/main/res/drawable/ic_mono.xml' <<'EOF_I'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#FFFFFF" android:pathData="M50,28h8v26h-8z"/>
          <path android:fillColor="#FFFFFF" android:pathData="M38,48L54,66L70,48Z"/>
          <path android:strokeColor="#FFFFFF" android:strokeWidth="7" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M35,64V76H73V64"/>
          <path android:fillColor="#FFFFFF" android:pathData="M76,32m-5,0a5,5 0,1 1,10 0a5,5 0,1 1,-10 0"/>
          </vector>
          EOF_I
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_launcher.xml')"
          cat > 'app/src/main/res/drawable/ic_launcher.xml' <<'EOF_I'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#111111" android:pathData="M24,6h60a18,18 0,0 1,18 18v60a18,18 0,0 1,-18 18h-60a18,18 0,0 1,-18 -18v-60a18,18 0,0 1,18 -18z"/>
          <path android:fillColor="#FFFFFF" android:pathData="M50,28h8v26h-8z"/>
          <path android:fillColor="#FFFFFF" android:pathData="M38,48L54,66L70,48Z"/>
          <path android:strokeColor="#FFFFFF" android:strokeWidth="7" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M35,64V76H73V64"/>
          <path android:fillColor="#34D399" android:pathData="M76,32m-5,0a5,5 0,1 1,10 0a5,5 0,1 1,-10 0"/>
          </vector>
          EOF_I
          mkdir -p "$(dirname 'app/src/main/res/drawable-anydpi-v26/ic_launcher.xml')"
          cat > 'app/src/main/res/drawable-anydpi-v26/ic_launcher.xml' <<'EOF_I'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
              <monochrome android:drawable="@drawable/ic_mono" />
          </adaptive-icon>
          EOF_I
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_stat.xml')"
          cat > 'app/src/main/res/drawable/ic_stat.xml' <<'EOF_I'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#FFFFFF" android:pathData="M48,14h12v40h-12z"/>
          <path android:fillColor="#FFFFFF" android:pathData="M30,46L54,74L78,46Z"/>
          <path android:strokeColor="#FFFFFF" android:strokeWidth="10" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M22,72V92H86V72"/>
          </vector>
          EOF_I
          mkdir -p "$(dirname 'app/src/main/java/com/vtn/uploader/MainActivity.java')"
          cat > 'app/src/main/java/com/vtn/uploader/MainActivity.java' <<'EOF_J'
          package com.vtn.uploader;
          
          import android.Manifest;
          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;
          
          public class MainActivity extends Activity {
              WebView wv;
              static MainActivity inst;
              static volatile boolean visible = false;
          
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  inst = this;
                  bars(0xFFF6F6F4, true);
                  wv = new WebView(this);
                  wv.setBackgroundColor(0x00000000);
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setTextZoom(100);
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.addJavascriptInterface(new Bridge(), "App");
                  wv.loadUrl("file:///android_asset/index.html");
                  setContentView(wv);
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 2);
                  }
              }
          
              void bars(int c, boolean light) {
                  getWindow().setStatusBarColor(c);
                  getWindow().setNavigationBarColor(c);
                  getWindow().getDecorView().setBackgroundColor(c);
                  if (Build.VERSION.SDK_INT >= 23) {
                      int f = light ? android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR : 0;
                      if (light && Build.VERSION.SDK_INT >= 26) f |= android.view.View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                      getWindow().getDecorView().setSystemUiVisibility(f);
                  }
              }

              void js(final String type, final String msg) {
                  runOnUiThread(new Runnable() { public void run() {
                      if (wv != null) wv.evaluateJavascript("window.onNative&&onNative(" + JSONObject.quote(type) + "," + JSONObject.quote(msg) + ")", null);
                  }});
              }
          
              void refresh() { if (wv != null) wv.evaluateJavascript("window.onAppResume&&onAppResume()", null); }
          
              @Override
              protected void onResume() { super.onResume(); visible = true; refresh(); }

              @Override
              protected void onPause() { super.onPause(); visible = false; }

              @Override
              protected void onDestroy() { if (inst == this) inst = null; super.onDestroy(); }
          
              @Override
              public void onRequestPermissionsResult(int code, String[] p, int[] r) { super.onRequestPermissionsResult(code, p, r); refresh(); }
          
              @Override
              public void onBackPressed() { moveTaskToBack(true); }
          
              boolean has() {
                  if (Build.VERSION.SDK_INT >= 30) return Environment.isExternalStorageManager();
                  return checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED;
              }
          
              static String sig(PackageInfo p) {
                  try {
                      if (p == null || p.signatures == null || p.signatures.length == 0) return null;
                      byte[] d = MessageDigest.getInstance("SHA-256").digest(p.signatures[0].toByteArray());
                      StringBuilder sb = new StringBuilder();
                      for (byte x : d) sb.append(String.format("%02X", x));
                      return sb.toString();
                  } catch (Exception e) { return null; }
              }
          
              static long vc(PackageInfo p) { return Build.VERSION.SDK_INT >= 28 ? p.getLongVersionCode() : p.versionCode; }
          
              void doDownload(String url, String name, String pkg) {
                  File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "VideoToNote");
                  dir.mkdirs();
                  File part = new File(dir, name + ".part");
                  File dst = new File(dir, name);
                  if (part.exists()) part.delete();
                  long total = -1;
                  Exception last = null;
                  for (int attempt = 1; attempt <= 5; attempt++) {
                      try {
                          long have = part.exists() ? part.length() : 0;
                          HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                          c.setInstanceFollowRedirects(true);
                          c.setConnectTimeout(20000);
                          c.setReadTimeout(30000);
                          c.setRequestProperty("User-Agent", "vtn-uploader");
                          if (have > 0) c.setRequestProperty("Range", "bytes=" + have + "-");
                          int code = c.getResponseCode();
                          if (code != 200 && code != 206) throw new Exception("HTTP " + code);
                          if (code == 200) have = 0;
                          long len = c.getContentLength();
                          if (len > 0) total = have + len;
                          InputStream in = c.getInputStream();
                          FileOutputStream out = new FileOutputStream(part, have > 0);
                          byte[] buf = new byte[65536];
                          long got = have; int n, lastPct = -1;
                          try {
                              while ((n = in.read(buf)) > 0) {
                                  out.write(buf, 0, n); got += n;
                                  int pct = total > 0 ? (int) (got * 100 / total) : -1;
                                  if (pct != lastPct) { lastPct = pct; js("p", String.valueOf(pct)); }
                              }
                          } finally { out.close(); in.close(); }
                          if (total > 0 && part.length() < total) throw new Exception("连接中断，已下载 " + part.length() / 1024 + " KB");
                          last = null;
                          break;
                      } catch (Exception e) {
                          last = e;
                          js("w", "第 " + attempt + " 次下载中断（" + e.getMessage() + "），" + (attempt < 5 ? "3 秒后从断点续传" : "放弃"));
                          try { Thread.sleep(3000); } catch (Exception ignored) {}
                      }
                  }
                  if (last != null) { js("e", "下载失败：" + last.getMessage() + "。检查网络或 VPN 后重试"); return; }
                  if (dst.exists()) dst.delete();
                  if (!part.renameTo(dst)) { js("e", "保存文件失败"); return; }
                  try {
                      PackageManager pm = getPackageManager();
                      PackageInfo ai = pm.getPackageArchiveInfo(dst.getPath(), PackageManager.GET_SIGNATURES);
                      if (ai == null) { js("e", "下载的文件不是有效的 APK"); return; }
                      String note = "APK 版本 " + ai.versionName + "（" + vc(ai) + "）";
                      PackageInfo ii = null;
                      try { ii = pm.getPackageInfo(pkg, PackageManager.GET_SIGNATURES); } catch (Exception ignored) {}
                      if (ii != null) {
                          String s1 = sig(ii), s2 = sig(ai);
                          if (s1 != null && s2 != null && !s1.equals(s2)) js("w", "注意：签名和手机上已装的不一致，直接覆盖会失败。先检查仓库里的 vtn.jks");
                          else note += "，签名一致";
                          if (vc(ai) <= vc(ii)) js("w", "这个 APK 不比已装的新（已装 " + ii.versionName + "）");
                      }
                      js("i", note);
                  } catch (Exception ignored) {}
                  js("dl", dst.getAbsolutePath());
              }
          
              class Bridge {
                  @JavascriptInterface public boolean hasAccess() { return has(); }

                  @JavascriptInterface
                  public boolean startWatch(String cfg) {
                      if (BuildService.running) return false;
                      BuildService.running = true;
                      BuildService.reset();
                      try {
                          Intent i = new Intent(MainActivity.this, BuildService.class).putExtra("cfg", cfg);
                          if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
                          return true;
                      } catch (Exception e) { BuildService.running = false; js("e", "启动后台服务失败：" + e.getMessage()); return false; }
                  }
                  @JavascriptInterface public boolean svcRunning() { return BuildService.running; }
                  @JavascriptInterface public String events() { return BuildService.events(); }
                  @JavascriptInterface public boolean canPop() { return Settings.canDrawOverlays(MainActivity.this); }
                  @JavascriptInterface
                  public void requestPop() {
                      try { startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()))); }
                      catch (Exception e) { try { startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION)); } catch (Exception ignored) {} }
                  }
                  @JavascriptInterface
                  public boolean batOk() {
                      android.os.PowerManager p = (android.os.PowerManager) getSystemService(POWER_SERVICE);
                      return p != null && p.isIgnoringBatteryOptimizations(getPackageName());
                  }
                  @JavascriptInterface
                  public void requestBat() {
                      try { startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getPackageName()))); }
                      catch (Exception e) { try { startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)); } catch (Exception ignored) {} }
                  }

                  @JavascriptInterface
                  public void setBars(final String hex, final boolean light) {
                      runOnUiThread(new Runnable() { public void run() {
                          try { bars(android.graphics.Color.parseColor(hex), light); } catch (Exception ignored) {}
                      }});
                  }
          
                  @JavascriptInterface
                  public void requestAccess() {
                      runOnUiThread(new Runnable() { public void run() {
                          try {
                              if (Build.VERSION.SDK_INT >= 30) startActivity(new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + getPackageName())));
                              else requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE, Manifest.permission.WRITE_EXTERNAL_STORAGE}, 1);
                          } catch (Exception e) {
                              try { startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)); } catch (Exception ignored) {}
                          }
                      }});
                  }
          
                  @JavascriptInterface
                  public String listYml() {
                      JSONArray arr = new JSONArray();
                      try {
                          List<File> all = new ArrayList<File>();
                          File[] fs = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS).listFiles();
                          if (fs != null) for (File f : fs) {
                              String n = f.getName().toLowerCase();
                              if (f.isFile() && (n.endsWith(".yml") || n.endsWith(".yaml"))) all.add(f);
                          }
                          Collections.sort(all, new Comparator<File>() { public int compare(File a, File c) {
                              boolean ba = a.getName().toLowerCase().contains("build"), bc = c.getName().toLowerCase().contains("build");
                              if (ba != bc) return ba ? -1 : 1;
                              return Long.compare(c.lastModified(), a.lastModified());
                          }});
                          for (File f : all) {
                              JSONObject o = new JSONObject();
                              o.put("path", f.getAbsolutePath()); o.put("name", f.getName());
                              o.put("size", f.length()); o.put("mtime", f.lastModified());
                              arr.put(o);
                          }
                      } catch (Exception ignored) {}
                      return arr.toString();
                  }
          
                  @JavascriptInterface
                  public String readB64(String path) {
                      try {
                          File f = new File(path);
                          if (!f.isFile() || f.length() == 0 || f.length() > 5 * 1024 * 1024) return "";
                          byte[] buf = new byte[(int) f.length()];
                          FileInputStream in = new FileInputStream(f);
                          try { int off = 0, n; while (off < buf.length && (n = in.read(buf, off, buf.length - off)) > 0) off += n; }
                          finally { in.close(); }
                          return Base64.encodeToString(buf, Base64.NO_WRAP);
                      } catch (Exception e) { return ""; }
                  }
          
                  @JavascriptInterface
                  public String installedInfo(String pkg) {
                      try {
                          PackageInfo p = getPackageManager().getPackageInfo(pkg, PackageManager.GET_SIGNATURES);
                          JSONObject o = new JSONObject();
                          o.put("name", p.versionName); o.put("code", vc(p));
                          String sg = sig(p); o.put("sig", sg == null ? "" : sg.substring(0, 12));
                          return o.toString();
                      } catch (Exception e) { return ""; }
                  }
          
                  @JavascriptInterface
                  public String listApps() {
                      JSONArray arr = new JSONArray();
                      try {
                          PackageManager pm = getPackageManager();
                          Intent i = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
                          List<ResolveInfo> rs = pm.queryIntentActivities(i, 0);
                          for (ResolveInfo r : rs) {
                              JSONObject o = new JSONObject();
                              o.put("pkg", r.activityInfo.packageName);
                              o.put("name", String.valueOf(r.loadLabel(pm)));
                              arr.put(o);
                          }
                      } catch (Exception ignored) {}
                      return arr.toString();
                  }
          
                  @JavascriptInterface
                  public boolean openApp(String pkg) {
                      try {
                          Intent i = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (i == null) return false;
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                          return true;
                      } catch (Exception e) { return false; }
                  }
          
                  @JavascriptInterface
                  public void download(final String url, final String name, final String pkg) {
                      new Thread(new Runnable() { public void run() { doDownload(url, name, pkg); } }).start();
                  }
          
                  @JavascriptInterface
                  public void openUrl(String url) {
                      try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception ignored) {}
                  }
          
                  @JavascriptInterface
                  public void toast(final String m) {
                      runOnUiThread(new Runnable() { public void run() { Toast.makeText(MainActivity.this, m, Toast.LENGTH_SHORT).show(); }});
                  }
          
                  @JavascriptInterface
                  public void keepScreen(final boolean on) {
                      runOnUiThread(new Runnable() { public void run() {
                          if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      }});
                  }
          
                  @JavascriptInterface
                  public void notify(String title, String text, String pkg) {
                      try {
                          NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                          Notification.Builder nb;
                          if (Build.VERSION.SDK_INT >= 26) {
                              nm.createNotificationChannel(new NotificationChannel("build", "编译结果", NotificationManager.IMPORTANCE_DEFAULT));
                              nb = new Notification.Builder(MainActivity.this, "build");
                          } else nb = new Notification.Builder(MainActivity.this);
                          Intent target = null;
                          if (pkg != null && pkg.length() > 0) target = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (target == null) target = new Intent(MainActivity.this, MainActivity.class);
                          PendingIntent pi = PendingIntent.getActivity(MainActivity.this, 0, target, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                          nb.setSmallIcon(R.drawable.ic_stat).setContentTitle(title).setContentText(text).setAutoCancel(true).setContentIntent(pi);
                          nm.notify(1, nb.build());
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF_J
          mkdir -p "$(dirname 'app/src/main/java/com/vtn/uploader/BuildService.java')"
          cat > 'app/src/main/java/com/vtn/uploader/BuildService.java' <<'EOF_V'
          package com.vtn.uploader;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ServiceInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.provider.Settings;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.List;

          public class BuildService extends Service {
              static volatile boolean running = false;
              static final List<String[]> EV = new ArrayList<String[]>();
              String tok, repo, sha, pkg, dsh;
              int toMin, code;
              boolean auto, only;
              PowerManager.WakeLock wl;
              NotificationManager nm;

              @Override public IBinder onBind(Intent i) { return null; }

              static void reset() { synchronized (EV) { EV.clear(); } }

              static String events() {
                  JSONArray a = new JSONArray();
                  synchronized (EV) { for (String[] e : EV) { JSONArray x = new JSONArray(); x.put(e[0]); x.put(e[1]); a.put(x); } }
                  return a.toString();
              }

              void emit(String t, String m) {
                  if (!t.equals("p")) synchronized (EV) { EV.add(new String[]{t, m}); }
                  MainActivity a = MainActivity.inst;
                  if (a != null) a.js(t, m);
              }

              void status(String t, String sub) { emit("st", t + "|" + sub); ongoing(t, sub, -2); }

              Notification.Builder nb(String ch) { return Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, ch) : new Notification.Builder(this); }

              PendingIntent pi(Intent i, int rc) {
                  if (i == null) i = new Intent(this, MainActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  return PendingIntent.getActivity(this, rc, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              Notification ongoingN(String t, String sub, int pct) {
                  Notification.Builder b = nb("run").setSmallIcon(R.drawable.ic_stat).setContentTitle(t).setContentText(sub)
                      .setOngoing(true).setOnlyAlertOnce(true).setContentIntent(pi(null, 1));
                  if (pct >= 0) b.setProgress(100, pct, false); else if (pct == -1) b.setProgress(0, 0, true);
                  return b.build();
              }

              void ongoing(String t, String sub, int pct) { try { nm.notify(2, ongoingN(t, sub, pct)); } catch (Exception ignored) {} }

              void result(String t, String sub, Intent target) {
                  try {
                      nm.notify(3, nb("done").setSmallIcon(R.drawable.ic_stat).setContentTitle(t).setContentText(sub)
                          .setAutoCancel(true).setPriority(Notification.PRIORITY_HIGH).setContentIntent(pi(target, 3)).build());
                  } catch (Exception ignored) {}
              }

              @Override
              public int onStartCommand(Intent it, int flags, int id) {
                  nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(new NotificationChannel("run", "后台进度", NotificationManager.IMPORTANCE_LOW));
                      nm.createNotificationChannel(new NotificationChannel("done", "完成提醒", NotificationManager.IMPORTANCE_HIGH));
                  }
                  Notification n = ongoingN("build助手", "后台运行中", -1);
                  if (Build.VERSION.SDK_INT >= 29) startForeground(2, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                  else startForeground(2, n);
                  try {
                      JSONObject o = new JSONObject(it.getStringExtra("cfg"));
                      tok = o.optString("tok"); repo = o.optString("repo"); sha = o.optString("sha");
                      pkg = o.optString("pkg"); dsh = o.optString("dsh");
                      toMin = o.optInt("to", 25); auto = o.optBoolean("auto", true); only = o.optBoolean("only", false);
                  } catch (Exception e) { running = false; stopForeground(true); stopSelf(); return START_NOT_STICKY; }
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "vtn:build");
                  wl.acquire(90 * 60 * 1000L);
                  new Thread(new Runnable() { public void run() {
                      try { work(); }
                      catch (Exception e) { emit("e", String.valueOf(e.getMessage())); result("build助手出错", String.valueOf(e.getMessage()), null); }
                      finally {
                          running = false;
                          emit("done", "");
                          try { if (wl.isHeld()) wl.release(); } catch (Exception ignored) {}
                          stopForeground(true);
                          stopSelf();
                      }
                  }}).start();
                  return START_NOT_STICKY;
              }

              static String read(InputStream in) throws Exception {
                  if (in == null) return "";
                  ByteArrayOutputStream b = new ByteArrayOutputStream();
                  byte[] buf = new byte[16384]; int n;
                  while ((n = in.read(buf)) > 0) b.write(buf, 0, n);
                  in.close();
                  return b.toString("UTF-8");
              }

              String gh(String path) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL("https://api.github.com" + path).openConnection();
                  c.setConnectTimeout(20000); c.setReadTimeout(30000);
                  c.setRequestProperty("Accept", "application/vnd.github+json");
                  c.setRequestProperty("User-Agent", "vtn-uploader");
                  if (tok != null && tok.length() > 0) c.setRequestProperty("Authorization", "token " + tok);
                  code = c.getResponseCode();
                  return read(code >= 400 ? c.getErrorStream() : c.getInputStream());
              }

              static String p2(long n) { return n < 10 ? "0" + n : "" + n; }

              void work() throws Exception {
                  if (!only) {
                      emit("step", "1");
                      long t0 = System.currentTimeMillis(), end = t0 + toMin * 60000L;
                      String last = "";
                      boolean ok = false;
                      while (System.currentTimeMillis() < end) {
                          Thread.sleep(10000);
                          long sec = (System.currentTimeMillis() - t0) / 1000;
                          String tm = (sec / 60) + ":" + p2(sec % 60);
                          String body;
                          try { body = gh("/repos/" + repo + "/actions/runs?head_sha=" + sha + "&per_page=10"); } catch (Exception e) { continue; }
                          if (code != 200) continue;
                          JSONArray runs = new JSONObject(body).optJSONArray("workflow_runs");
                          JSONObject rn = null;
                          if (runs != null) for (int i = 0; i < runs.length(); i++) {
                              JSONObject x = runs.getJSONObject(i);
                              if (!sha.equals(x.optString("head_sha"))) continue;
                              if (rn == null) rn = x;
                              if ((x.optString("path") + x.optString("name")).toLowerCase().contains("build")) { rn = x; break; }
                          }
                          if (rn == null) { status("等待编译开始", "已等 " + tm + "，可以切到后台"); continue; }
                          String st = rn.optString("status"), cc = rn.optString("conclusion"), url = rn.optString("html_url");
                          status("queued".equals(st) ? "排队中" : "编译中", "已用 " + tm + "，可以切到后台");
                          String k = st + "/" + cc;
                          if (k.equals(last)) continue;
                          last = k;
                          if ("in_progress".equals(st)) { emit("d", "编译中…"); emit("link", "编译日志|" + url); }
                          else if ("completed".equals(st)) {
                              if ("success".equals(cc)) { emit("g", "编译成功，用时 " + tm); ok = true; break; }
                              emit("step", "1|bad"); emit("st", "编译失败|" + cc); emit("link", "失败日志|" + url);
                              result("编译失败", "点开查看日志", new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              return;
                          }
                      }
                      if (!ok) {
                          String a = "https://github.com/" + repo + "/actions";
                          emit("st", "等待超时|可到 Actions 页面看进度"); emit("link", "Actions 页面|" + a);
                          result("等待编译超时", "点开查看 Actions", new Intent(Intent.ACTION_VIEW, Uri.parse(a)));
                          return;
                      }
                      if (!auto) {
                          emit("step", "2"); emit("st", "编译成功|点下面按钮下载"); emit("btn", "下载最新版");
                          result("编译成功", "打开 build助手 下载", null);
                          return;
                      }
                      Thread.sleep(3000);
                  }
                  download();
              }

              void download() throws Exception {
                  emit("step", "2");
                  status("查找最新版", "");
                  JSONObject rel = null, asset = null;
                  for (int t = 0; t < 6 && asset == null; t++) {
                      if (t > 0) Thread.sleep(10000);
                      String body;
                      try { body = gh("/repos/" + repo + "/releases?per_page=15"); } catch (Exception e) { if (t == 5) throw e; continue; }
                      if (code != 200) { if (t == 5) throw new Exception("读取发布列表失败（HTTP " + code + "）"); continue; }
                      JSONArray a = new JSONArray(body);
                      for (int i = 0; i < a.length() && asset == null; i++) {
                          JSONObject x = a.getJSONObject(i);
                          if (x.optBoolean("draft") || x.optBoolean("prerelease")) continue;
                          JSONArray as = x.optJSONArray("assets");
                          if (as == null) continue;
                          for (int j = 0; j < as.length(); j++) {
                              JSONObject y = as.getJSONObject(j);
                              String n = y.optString("name");
                              if (n.toLowerCase().endsWith(".apk") && !n.contains("BuildUploader")) { rel = x; asset = y; break; }
                          }
                      }
                  }
                  if (asset == null) throw new Exception("没找到视频笔记的 APK 发布");
                  String tag = rel.optString("tag_name", "latest"), title = rel.optString("name", "");
                  if (title.length() == 0 || "null".equals(title)) title = tag;
                  emit("lv", title);
                  emit("d", "开始下载：" + title + " · " + String.format("%.1f MB", asset.optLong("size") / 1048576.0));
                  status("下载中", title + "，可以切到后台");
                  File f = fetch(asset.optString("browser_download_url"), "VideoToNote-" + tag + ".apk");
                  check(f);
                  emit("dl", f.getAbsolutePath());
                  emit("step", "3");
                  emit("st", "下载完成|" + title);
                  launch(title);
              }

              File fetch(String url, String name) throws Exception {
                  File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "VideoToNote");
                  dir.mkdirs();
                  File part = new File(dir, name + ".part"), dst = new File(dir, name);
                  if (part.exists()) part.delete();
                  long total = -1;
                  Exception lastE = null;
                  for (int at = 1; at <= 5; at++) {
                      try {
                          long have = part.exists() ? part.length() : 0;
                          HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                          c.setInstanceFollowRedirects(true); c.setConnectTimeout(20000); c.setReadTimeout(30000);
                          c.setRequestProperty("User-Agent", "vtn-uploader");
                          if (have > 0) c.setRequestProperty("Range", "bytes=" + have + "-");
                          int rc = c.getResponseCode();
                          if (rc != 200 && rc != 206) throw new Exception("HTTP " + rc);
                          if (rc == 200) have = 0;
                          long len = c.getContentLength();
                          if (len > 0) total = have + len;
                          InputStream in = c.getInputStream();
                          FileOutputStream out = new FileOutputStream(part, have > 0);
                          byte[] buf = new byte[65536];
                          long got = have; int n, lastPct = -2;
                          try {
                              while ((n = in.read(buf)) > 0) {
                                  out.write(buf, 0, n); got += n;
                                  int pct = total > 0 ? (int) (got * 100 / total) : -1;
                                  if (pct != lastPct) { lastPct = pct; emit("p", "" + pct); ongoing("下载中", pct >= 0 ? pct + "%" : "", pct >= 0 ? pct : -1); }
                              }
                          } finally { out.close(); in.close(); }
                          if (total > 0 && got < total) throw new Exception("只收到 " + got + "/" + total + " 字节");
                          lastE = null;
                          break;
                      } catch (Exception e) {
                          lastE = e;
                          emit("w", "第 " + at + " 次下载中断（" + e.getMessage() + "），" + (at < 5 ? "3 秒后续传" : "放弃"));
                          Thread.sleep(3000);
                      }
                  }
                  if (lastE != null) throw new Exception("下载失败：" + lastE.getMessage() + "。检查网络或 VPN 后重试");
                  if (dst.exists()) dst.delete();
                  if (!part.renameTo(dst)) throw new Exception("保存文件失败");
                  return dst;
              }

              void check(File dst) {
                  try {
                      PackageManager pmg = getPackageManager();
                      PackageInfo ai = pmg.getPackageArchiveInfo(dst.getPath(), PackageManager.GET_SIGNATURES);
                      if (ai == null) { emit("w", "下载的文件不像有效的 APK"); return; }
                      String note = "APK 版本 " + ai.versionName + "（" + MainActivity.vc(ai) + "）";
                      PackageInfo ii = null;
                      try { ii = pmg.getPackageInfo(pkg, PackageManager.GET_SIGNATURES); } catch (Exception ignored) {}
                      if (ii != null) {
                          String s1 = MainActivity.sig(ii), s2 = MainActivity.sig(ai);
                          if (s1 != null && s2 != null && !s1.equals(s2)) emit("w", "注意：签名和已装的不一致，直接覆盖会失败");
                          else note += "，签名一致";
                          if (MainActivity.vc(ai) <= MainActivity.vc(ii)) emit("w", "这个 APK 不比已装的新（已装 " + ii.versionName + "）");
                      }
                      emit("i", note);
                  } catch (Exception ignored) {}
              }

              void launch(String title) {
                  Intent i = (dsh == null || dsh.length() == 0) ? null : getPackageManager().getLaunchIntentForPackage(dsh);
                  if (i == null) {
                      emit("w", "没有设置或找不到 DSH GO，请在 更新 页选择");
                      result("新版视频笔记已下载", title, null);
                      return;
                  }
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  if (MainActivity.visible || Settings.canDrawOverlays(this)) {
                      try { startActivity(i); emit("g", "已自动打开 DSH GO"); emit("step", "4"); }
                      catch (Exception e) { emit("w", "自动打开失败：" + e.getMessage()); }
                  } else {
                      emit("w", "没开「显示在其他应用上层」，系统不让后台直接跳转，已发通知，点通知进入 DSH GO");
                  }
                  result("新版视频笔记已下载", "点这里打开 DSH GO 安装 " + title, i);
              }
          }
          EOF_V
          mkdir -p "$(dirname 'app/src/main/assets/index.html')"
          cat > 'app/src/main/assets/index.html' <<'EOF_H'
          <!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>build助手</title><style>
          :root{--bg:#f6f6f4;--card:#fff;--tx:#111;--mu:#6b6b6b;--ln:#e7e7e4;--soft:#efefec;--ac:#111;--act:#fff;--g:#16a34a;--r:#dc2626}
          @media(prefers-color-scheme:dark){:root{--bg:#0c0c0c;--card:#171717;--tx:#f2f2f2;--mu:#9a9a9a;--ln:#2a2a2a;--soft:#222;--ac:#f2f2f2;--act:#111;--g:#4ade80;--r:#f87171}}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
          .w{max-width:760px;margin:auto;padding:14px 18px 40px}
          .top{display:flex;align-items:center;gap:12px;margin:6px 0 16px}.logo{width:40px;height:40px;flex:0 0 auto}
          .top h1{font-size:20px;margin:0;flex:1}.top small{display:block;font-size:12px;color:var(--mu);font-weight:400;margin-top:2px}
          .c{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:18px;margin-bottom:14px}
          .c h2{font-size:13px;color:var(--mu);font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
          .hero{display:flex;gap:16px;align-items:center}
          .ring{width:64px;height:64px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ac) calc(var(--p,0)*1%),var(--soft) 0)}
          .ring::after{content:attr(data-t);width:52px;height:52px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:700}
          #st{font-size:21px;font-weight:700;margin:0 0 4px}#sub{font-size:13px;color:var(--mu);min-height:18px;word-break:break-all}
          .steps{display:flex;gap:6px;margin:16px 0 2px}
          .sp{flex:1;text-align:center;font-size:12px;color:var(--mu)}
          .sp i{display:block;height:4px;border-radius:2px;background:var(--ln);margin-bottom:6px;transition:background .3s}
          .sp.on i{background:var(--ac)}.sp.on{color:var(--tx);font-weight:600}
          .sp.done i{background:var(--g)}.sp.bad i{background:var(--r)}.sp.bad{color:var(--r);font-weight:600}
          .bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:12px;display:none}.bar b{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
          .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.acts:empty{display:none}
          .acts button{background:var(--soft);font-size:14px;padding:9px 14px}.acts button.pri{background:var(--ac);color:var(--act);font-weight:600}
          .tabs{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin:0 0 14px;position:sticky;top:6px;z-index:5}
          .tabs button{flex:1;background:none;padding:9px 0;border-radius:10px;font-size:14px;color:var(--mu)}
          .tabs button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 3px #0000001a}
          .pane{display:none;animation:up .25s ease}.pane.on{display:block}
          @keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
          @media(prefers-reduced-motion:reduce){.pane{animation:none}}
          .file{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--soft);border-radius:14px}
          .file select{width:100%;border:0;font-size:15px;font-weight:600;background:none;color:var(--tx);padding:0}
          .m{font-size:12px;color:var(--mu);margin-top:3px}
          button{border:0;border-radius:12px;padding:11px 14px;font-size:15px;background:var(--soft);color:var(--tx);font-family:inherit;transition:transform .12s,opacity .12s}
          button:active{transform:scale(.97);opacity:.8}button:disabled{opacity:.4}
          .main{width:100%;margin-top:12px;padding:15px;font-size:16px;font-weight:700;background:var(--ac);color:var(--act);border-radius:14px}
          .kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln);font-size:14px}.kv:last-of-type{border:0}
          .kv span:first-child{color:var(--mu);flex:0 0 auto}.kv span:last-child{text-align:right;word-break:break-all}
          .row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1}.row .pri{background:var(--ac);color:var(--act);font-weight:600}
          #log{background:#0f0f0f;color:#e5e5e5;border-radius:12px;padding:10px 12px;font:12.5px/1.6 monospace;max-height:300px;overflow:auto;white-space:pre-wrap;margin-top:10px}
          #log:empty::before{content:"暂无记录";color:#777}
          .g{color:#4ade80}.r{color:#f87171}.y{color:#fbbf24}.d{color:#9ca3af}
          label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
          input[type=text],input[type=password],input[type=number],select.f{width:100%;padding:11px 12px;border:1px solid transparent;border-radius:12px;font-size:15px;background:var(--soft);color:var(--tx);outline:none}
          input:focus,select.f:focus{border-color:var(--ac);background:var(--card)}
          .chk{display:flex;align-items:center;gap:10px;color:var(--tx);font-size:14px;margin:14px 0 0}.chk input{width:18px;height:18px;accent-color:var(--ac)}
          .pill{font-size:12px;padding:4px 10px;border-radius:99px;font-weight:600}.ok{background:#16a34a22;color:var(--g)}.no{background:#dc262622;color:var(--r)}
          .warn{display:none;border-color:#f9731666;background:#f9731612}.warn button{background:#f97316;color:#fff;margin-top:10px}
          details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
          .tl{font-size:12px;color:var(--mu);font-weight:400}details[open] .tl::after{content:"收起"}details:not([open]) .tl::after{content:"展开"}
          @media(min-width:900px){.w{max-width:1040px}.wide{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.wide>.c{margin:0}}
          </style></head><body><div class="w">
          <div class="top"><svg viewBox="0 0 108 108" class="logo"><rect x="6" y="6" width="96" height="96" rx="22" fill="#111"/><path d="M50 28h8v26h-8z" fill="#fff"/><path d="M38 48L54 66L70 48Z" fill="#fff"/><path d="M35 64V76H73V64" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="76" cy="32" r="5" fill="#34d399"/></svg><h1>build助手<small>上传 build.yml · 编译 · 下载新版</small></h1><span id="tokpill"></span></div>
          <div class="c warn" id="perm"><b>需要文件权限</b><div style="font-size:14px;margin-top:6px">用于读取"下载"里的 build.yml，并把 APK 保存到 下载/VideoToNote。</div><button onclick="App.requestAccess()">去开启</button></div>
          <div class="c">
          <div class="hero"><div class="ring" id="ring" data-t="就绪"></div><div style="flex:1;min-width:0"><div id="st">准备就绪</div><div id="sub">选好文件后点上传</div></div></div>
          <div class="bar" id="bar"><b id="barb"></b></div>
          <div class="steps"><div class="sp" id="s0"><i></i>上传</div><div class="sp" id="s1"><i></i>编译</div><div class="sp" id="s2"><i></i>下载</div><div class="sp" id="s3"><i></i>DSH GO</div></div>
          <div class="acts" id="links"></div></div>
          <div class="tabs" id="tabs"><button class="on" onclick="tab(0)">编译</button><button onclick="tab(1)">更新</button><button onclick="tab(2)">设置</button></div>
          <div class="pane on" id="p0"><div class="wide">
          <div class="c"><h2>要上传的文件 <button style="padding:6px 12px;font-size:13px" onclick="loadFiles(true)">刷新</button></h2>
          <div class="file"><div style="flex:1;min-width:0"><select id="f"></select><div class="m" id="newest"></div></div></div>
          <button class="main" id="go" onclick="act(run)">上传并编译</button></div>
          <div class="c"><details id="logbox"><summary><h2 style="margin:0">运行日志 <span class="tl"></span></h2></summary><div id="log"></div></details></div>
          </div></div>
          <div class="pane" id="p1"><div class="wide">
          <div class="c"><h2>视频笔记</h2>
          <div class="kv"><span>平板上</span><span id="iv">读取中…</span></div>
          <div class="kv"><span>线上最新</span><span id="lv">未检查</span></div>
          <div class="kv"><span>已下载</span><span id="dv">无</span></div>
          <div class="row"><button onclick="act(checkLatest)">检查更新</button><button class="pri" onclick="act(downloadLatest)">下载最新版</button></div></div>
          <div class="c"><h2>安装器（DSH GO）</h2>
          <div class="kv"><span>目标应用</span><span id="dshv">未设置</span></div>
          <label>更换目标应用</label><select class="f" id="appsel"></select>
          <div class="row"><button onclick="openDsh(true)">现在打开</button></div></div>
          </div></div>
          <div class="pane" id="p2"><div class="wide">
          <div class="c"><h2>GitHub</h2>
          <label>Token（需 repo + workflow 写权限）</label><div class="row" style="margin-top:0"><input id="tok" type="password" placeholder="粘贴后点保存"><button style="flex:0 0 auto" onclick="saveTok()">保存</button></div>
          <label>仓库</label><input id="repo" type="text">
          <div class="row" style="margin-top:0"><div><label>分支</label><input id="br" type="text"></div><div><label>最长等待（分钟）</label><input id="to" type="number"></div></div>
          <label>仓库内路径</label><input id="tg" type="text"></div>
          <div class="c"><h2>后台运行</h2>
          <div class="kv"><span>后台完成后直接跳转 DSH GO</span><span id="popv">-</span></div>
          <div class="kv"><span>不受省电限制</span><span id="batv">-</span></div>
          <div class="row"><button onclick="App.requestPop()">开启悬浮窗权限</button><button onclick="App.requestBat()">关闭省电限制</button></div>
          <div class="m" style="margin-top:10px">开了「显示在其他应用上层」，后台下载完会直接跳到 DSH GO；没开只发通知，点一下进入。</div></div>
          <div class="c"><h2>行为</h2>
          <label>视频笔记包名</label><input id="pkg" type="text">
          <label class="chk"><input id="auto" type="checkbox">编译成功后自动下载并打开 DSH GO</label>
          <label class="chk"><input id="quick" type="checkbox">打开 App 时，若 build.yml 是 <input id="qs" type="number" style="width:64px;display:inline-block;padding:4px 6px"> 秒内刚下载的，自动上传并编译</label>
          <label class="chk"><input id="dry" type="checkbox">试运行（只检查，不提交）</label>
          <button class="main" onclick="saveOpt()">保存设置</button></div>
          </div></div>
          </div>
          <script>
          const $=i=>document.getElementById(i),API="https://api.github.com",LS=localStorage;
          const DEF={repo:"jlynolson53-hue/VideoToNote-Lite",br:"main",tg:".github/workflows/build.yml",pkg:"com.vtn.lite",to:"25"};
          let busy=false,files=[],apps=[],dlWait=null;
          const kb=n=>(n/1024).toFixed(1)+" KB",sleep=ms=>new Promise(r=>setTimeout(r,ms)),p2=n=>String(n).padStart(2,"0");
          function fmt(t){const d=new Date(t);return p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes())}
          function tab(n){document.querySelectorAll("#tabs button").forEach((b,i)=>b.classList.toggle("on",i==n));for(let i=0;i<3;i++)$("p"+i).classList.toggle("on",i==n);LS.setItem("vtn_tab",n)}
          function ring(){const on=document.querySelector(".sp.on"),done=document.querySelectorAll(".sp.done").length,r=$("ring"),bad=!!document.querySelector(".sp.bad");
           r.style.setProperty("--p",done*25);r.dataset.t=bad?"失败":done>=4?"完成":on?(done+1)+"/4":"就绪"}
          function theme(){const d=matchMedia("(prefers-color-scheme: dark)").matches;try{App.setBars(d?"#0c0c0c":"#f6f6f4",!d)}catch(e){}}
          matchMedia("(prefers-color-scheme: dark)").addEventListener("change",theme);
          function quick(){try{if(busy||App.svcRunning()||!$("quick").checked||!LS.getItem("vtn_tok")||!files.length)return;
           const x=files[0],age=(Date.now()-x.mtime)/1000,lim=+$("qs").value||30,key=x.path+"@"+x.mtime;
           if(age<0||age>lim||LS.getItem("vtn_quick")==key)return;
           LS.setItem("vtn_quick",key);$("f").value=x.path;showFile();tab(0);
           say("检测到 "+Math.round(age)+" 秒前下载的 "+x.name+"，自动上传编译","g");App.toast("自动上传："+x.name);act(run)}catch(e){}}
          class Fail extends Error{}
          function say(m,c){const d=document.createElement("div");d.className=c||"";d.textContent="["+new Date().toTimeString().slice(0,8)+"] "+m;$("log").appendChild(d);$("log").scrollTop=1e9;if(c=="r"){$("logbox").open=true;tab(0)}}
          function st(t,sub){$("st").textContent=t;if(sub!==undefined)$("sub").textContent=sub}
          function step(i,state){for(let k=0;k<4;k++){const e=$("s"+k);e.className="sp"+(k<i?" done":k==i?" "+(state||"on"):"")}ring()}
          function bar(p){$("bar").style.display=p==null?"none":"block";$("barb").style.width=(p<0?30:p)+"%";if(p!=null&&p>=0)$("ring").dataset.t=p+"%"}
          function btn(t,fn,pri){const b=document.createElement("button");b.textContent=t;if(pri)b.className="pri";b.onclick=fn;$("links").appendChild(b)}
          function link(t,u){btn(t,()=>App.openUrl(u))}
          function showTok(){const t=LS.getItem("vtn_tok");$("tokpill").innerHTML=t?'<span class="pill ok">已授权</span>':'<span class="pill no">未设置 token</span>'}
          function saveTok(){const t=$("tok").value.trim();if(!t)return App.toast("先粘贴 token");LS.setItem("vtn_tok",t);$("tok").value="";showTok();App.toast("已保存")}
          function opt(){return JSON.parse(LS.getItem("vtn_opt")||"{}")}
          function loadOpt(){const o=opt();for(const k in DEF)$(k).value=o[k]||DEF[k];$("auto").checked=o.auto!==false;$("quick").checked=o.quick!==false;$("qs").value=o.qs||30}
          function saveOpt(){const o=opt();for(const k in DEF)o[k]=$(k).value.trim();o.auto=$("auto").checked;o.quick=$("quick").checked;o.qs=+$("qs").value||30;LS.setItem("vtn_opt",JSON.stringify(o));App.toast("已保存")}
          function dshPkg(){return opt().dsh||""}
          function loadApps(){apps=JSON.parse(App.listApps()).sort((a,b)=>a.name.localeCompare(b.name,"zh"));
           let cur=dshPkg();if(!cur){const h=apps.find(a=>/dsh/i.test(a.name)||/dsh/i.test(a.pkg));if(h){cur=h.pkg;const o=opt();o.dsh=cur;LS.setItem("vtn_opt",JSON.stringify(o))}}
           const s=$("appsel");s.innerHTML='<option value="">（选择应用）</option>';
           apps.forEach(a=>{const e=document.createElement("option");e.value=a.pkg;e.textContent=a.name;s.appendChild(e)});s.value=cur;
           const a=apps.find(x=>x.pkg==cur);$("dshv").textContent=a?a.name:(cur?"未安装："+cur:"未设置，请在下面选择")}
          $("appsel").onchange=()=>{const o=opt();o.dsh=$("appsel").value;LS.setItem("vtn_opt",JSON.stringify(o));loadApps();App.toast("已设为目标应用")};
          function openDsh(manual){const p=dshPkg();if(!p){App.toast("请先选择 DSH GO");return false}
           const ok=App.openApp(p);if(!ok&&manual)App.toast("打不开，请重新选择");return ok}
          function loadFiles(manual){const ok=App.hasAccess();$("perm").style.display=ok?"block":"none";$("perm").style.display=ok?"none":"block";
           const f=$("f");f.innerHTML="";if(!ok){f.innerHTML="<option value=''>未授权</option>";return}
           files=JSON.parse(App.listYml());
           if(!files.length){f.innerHTML="<option value=''>下载文件夹里没有 .yml</option>";$("newest").textContent="";return}
           files.forEach(x=>{const o=document.createElement("option");o.value=x.path;o.textContent=x.name;f.appendChild(o)});f.value=files[0].path;showFile();if(manual)App.toast("已刷新")}
          function showFile(){const x=files.find(y=>y.path==$("f").value);$("newest").textContent=x?kb(x.size)+" · 修改于 "+fmt(x.mtime)+(x==files[0]?" · 最新":""):""}
          $("f").onchange=showFile;
          function showInst(){const s=App.installedInfo($("pkg").value.trim());if(!s){$("iv").textContent="未安装";return}
           const i=JSON.parse(s);$("iv").textContent=i.name+"（"+i.code+"）"}
          window.onAppResume=()=>{bg();showInst();loadApps();if(!busy){loadFiles(false);quick()}};
          async function gh(path,o={}){const h={Accept:"application/vnd.github+json",Authorization:"token "+LS.getItem("vtn_tok")};if(o.body)h["Content-Type"]="application/json";
           try{const r=await fetch(API+path,{method:o.method||"GET",headers:h,body:o.body?JSON.stringify(o.body):undefined,cache:"no-store"});let j=null;try{j=await r.json()}catch(e){}return{s:r.status,j}}catch(e){return{s:0,j:{message:String(e)}}}}
          function repo(){return $("repo").value.trim().replace(/^\/|\/$/g,"")}
          async function act(fn){if(busy)return App.toast("正在进行中");busy=true;$("go").disabled=true;$("links").innerHTML="";$("log").innerHTML="";bar(null);
           try{await fn()}catch(e){say(e.message,"r");st("出错了",e.message)}finally{if(!App.svcRunning()){busy=false;$("go").disabled=false}App.keepScreen(false)}}
          async function latestRel(){const r=await gh("/repos/"+repo()+"/releases?per_page=15");if(r.s!=200)throw new Fail("读取发布列表失败（HTTP "+r.s+"）");
           for(const x of r.j){if(x.draft||x.prerelease)continue;const a=(x.assets||[]).find(a=>/\.apk$/i.test(a.name)&&!/BuildUploader/i.test(a.name));if(a)return{rel:x,asset:a}}
           throw new Fail("没找到视频笔记的 APK 发布")}
          async function checkLatest(){st("检查中","");const {rel,asset}=await latestRel();const t=(rel.name||rel.tag_name);
           $("lv").textContent=t;say("线上最新："+t+" · "+asset.name);showInst();st("检查完成",t)}
          window.onNative=(t,m)=>{const a=String(m).split("|");
           if(t=="p"){bar(+m);$("sub").textContent=m>=0?"已下载 "+m+"%，可以切到后台":"下载中…";return}
           if(t=="st"){st(a[0],a[1]||"");return}
           if(t=="step"){step(+a[0],a[1]);return}
           if(t=="link"){link(a[0],a.slice(1).join("|"));return}
           if(t=="btn"){btn(m,()=>act(downloadLatest),true);return}
           if(t=="lv"){$("lv").textContent=m;return}
           if(t=="dl"){$("dv").textContent=m.split("/").pop();bar(null);btn("打开 DSH GO",()=>openDsh(true),true);showInst();return}
           if(t=="done"){busy=false;$("go").disabled=false;bg();return}
           say(m,t=="e"?"r":t=="w"?"y":t=="g"?"g":"d");if(t=="e")st("出错了",m)};
          function bg(){try{$("popv").innerHTML=App.canPop()?'<span class="pill ok">已开启</span>':'<span class="pill no">未开启</span>';$("batv").innerHTML=App.batOk()?'<span class="pill ok">是</span>':'<span class="pill no">否</span>'}catch(e){}}
          function svcStart(o){if(!App.startWatch(JSON.stringify({tok:LS.getItem("vtn_tok")||"",repo:repo(),sha:o.sha||"",pkg:$("pkg").value.trim(),dsh:dshPkg(),to:+$("to").value||25,auto:!!o.auto,only:!!o.only})))throw new Fail("后台任务已在运行，或启动失败");
           say("已交给后台服务，可以离开本 App","d");if(!App.canPop())say("没开「显示在其他应用上层」，完成时只发通知，点通知进入 DSH GO（设置页可开启）","y")}
          async function downloadLatest(){if(!App.hasAccess()){App.requestAccess();throw new Fail("需要文件权限才能保存 APK")}
           step(2);st("下载中","已交给后台，可以切到别的 App");svcStart({auto:true,only:true})}
          async function run(){
           const path=$("f").value;if(!path)throw new Fail("没有可上传的文件");
           if(!LS.getItem("vtn_tok"))throw new Fail("还没设置 token，请在 设置 里填写");
           const br=$("br").value.trim()||"main",tg=$("tg").value.trim().replace(/^\//,""),R=repo();
           const info=files.find(x=>x.path==path)||{name:path};
           step(0);st("检查文件",info.name);const content=App.readB64(path);if(!content)throw new Fail("读不到文件，或文件是空的");
           const bin=atob(content),raw=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)raw[i]=bin.charCodeAt(i);
           const text=new TextDecoder().decode(raw);say("源文件："+info.name+"（"+kb(raw.length)+"）");
           if(!/^name:\s*\S/m.test(text)||!/^jobs:/m.test(text))throw new Fail("这个文件不像 GitHub Actions 工作流（缺 name: 或 jobs:）");
           const fp="/repos/"+R+"/contents/"+tg.split("/").map(encodeURIComponent).join("/");
           st("对比线上文件");let r=await gh(fp+"?ref="+encodeURIComponent(br)),online=null;
           if(r.s==200)online=r.j;
           else if(r.s==404){const b=await gh("/repos/"+R+"/git/ref/heads/"+encodeURIComponent(br));if(b.s==404)throw new Fail("仓库或分支 '"+br+"' 不存在");say("线上没有此文件，将新建","y")}
           else if(r.s==401||r.s==403)throw new Fail("token 无效或没权限（HTTP "+r.s+"）");
           else if(r.s==0)throw new Fail("连不上 GitHub，请检查网络/VPN");
           else throw new Fail("读取线上文件失败（HTTP "+r.s+"）");
           if(online&&(online.content||"").replace(/\s/g,"")===content){step(0,"done");st("无需上传","线上 build.yml 和这个文件完全一致");say("内容一致，未上传","g");return}
           const now=new Date(),msg="更新 build.yml - "+now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate())+" "+p2(now.getHours())+":"+p2(now.getMinutes());
           say("提交说明："+msg,"d");
           if($("dry").checked){st("试运行完成","未实际提交");return}
           st("上传中");let res=null;
           for(let a=0;a<2;a++){const body={message:msg,content,branch:br};if(online)body.sha=online.sha;
            r=await gh(fp,{method:"PUT",body});if(r.s==200||r.s==201){res=r.j;break}
            const det=r.j&&r.j.message||"";
            if((r.s==409||r.s==422)&&a==0){const r2=await gh(fp+"?ref="+encodeURIComponent(br));if(r2.s==200){online=r2.j;say("线上文件刚被改过，重试一次","y");continue}}
            if(r.s==403&&/personal access token/i.test(det))throw new Fail("token 没有写权限：需要 Contents 和 Workflows 读写权限");
            if(/workflow/i.test(det))throw new Fail("token 缺 workflow 权限");
            throw new Fail("上传失败（HTTP "+r.s+"）："+det)}
           const sha=res.commit.sha;say("上传成功，提交 "+sha.slice(0,7),"g");link("查看提交",res.commit.html_url);
           step(1);st("等待编译","已交给后台，可以切走，完成后自动下载并打开 DSH GO");svcStart({sha,auto:$("auto").checked})}
          theme();tab(+LS.getItem("vtn_tab")||0);loadOpt();showTok();loadFiles(false);showInst();loadApps();bg();if(App.svcRunning()){busy=true;$("go").disabled=true}JSON.parse(App.events()).forEach(e=>onNative(e[0],e[1]));quick();
          </script></body></html>
          EOF_H

      - name: Signing key (fixed, created once)
        shell: bash
        run: |
          if [ ! -f up.jks ]; then
            keytool -genkeypair -keystore up.jks -alias up -keyalg RSA -keysize 2048 -validity 36500 -storepass uploader123 -keypass uploader123 -dname "CN=BuildUploader"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add up.jks
            git commit -m "add fixed signing key [skip ci]"
            git push
          fi
      - name: Build APK
        shell: bash
        env:
          RUN_NO: ${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BuildUploader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BuildUploader
          path: BuildUploader.apk
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NO: ${{ github.run_number }}
        run: |
          gh release create "uploader-1.0.$RUN_NO" BuildUploader.apk --prerelease --title "build助手 1.0.$RUN_NO" --notes "build助手自动构建（打开时自动上传 30 秒内下载的 build.yml）（预发布，不影响视频笔记的 latest）"
