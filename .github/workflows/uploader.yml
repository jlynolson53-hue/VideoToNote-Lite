name: Build Uploader App

on:
  push:
    paths:
      - ".github/workflows/uploader.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate project
        shell: bash
        run: |
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'EOF_S'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BuildUploader"
          include ":app"
          EOF_S
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'EOF_R'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_R
          printf 'org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=false\n' > gradle.properties
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'EOF_A'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.vtn.uploader'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.vtn.uploader'
                  minSdk 24
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv("RUN_NO") ?: "1")
                  versionName "1.0." + (System.getenv("RUN_NO") ?: "1")
              }
              signingConfigs {
                  release {
                      storeFile rootProject.file('up.jks')
                      storePassword 'uploader123'
                      keyAlias 'up'
                      keyPassword 'uploader123'
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              lint { checkReleaseBuilds false; abortOnError false }
          }
          EOF_A
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_M'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <package android:name="com.vtn.lite" />
              </queries>
              <application android:label="build上传助手" android:icon="@android:drawable/stat_sys_upload"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_M
          mkdir -p "$(dirname 'app/src/main/java/com/vtn/uploader/MainActivity.java')"
          cat > 'app/src/main/java/com/vtn/uploader/MainActivity.java' <<'EOF_J'
          package com.vtn.uploader;
          
          import android.Manifest;
          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;
          
          public class MainActivity extends Activity {
              WebView wv;
          
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(0xFFF3F5F9);
                  if (Build.VERSION.SDK_INT >= 23) getWindow().getDecorView().setSystemUiVisibility(android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);
                  wv = new WebView(this);
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setTextZoom(100);
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.addJavascriptInterface(new Bridge(), "App");
                  wv.loadUrl("file:///android_asset/index.html");
                  setContentView(wv);
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 2);
                  }
              }
          
              void js(final String type, final String msg) {
                  runOnUiThread(new Runnable() { public void run() {
                      if (wv != null) wv.evaluateJavascript("window.onNative&&onNative(" + JSONObject.quote(type) + "," + JSONObject.quote(msg) + ")", null);
                  }});
              }
          
              void refresh() { if (wv != null) wv.evaluateJavascript("window.onAppResume&&onAppResume()", null); }
          
              @Override
              protected void onResume() { super.onResume(); refresh(); }
          
              @Override
              public void onRequestPermissionsResult(int code, String[] p, int[] r) { super.onRequestPermissionsResult(code, p, r); refresh(); }
          
              @Override
              public void onBackPressed() { moveTaskToBack(true); }
          
              boolean has() {
                  if (Build.VERSION.SDK_INT >= 30) return Environment.isExternalStorageManager();
                  return checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED;
              }
          
              static String sig(PackageInfo p) {
                  try {
                      if (p == null || p.signatures == null || p.signatures.length == 0) return null;
                      byte[] d = MessageDigest.getInstance("SHA-256").digest(p.signatures[0].toByteArray());
                      StringBuilder sb = new StringBuilder();
                      for (byte x : d) sb.append(String.format("%02X", x));
                      return sb.toString();
                  } catch (Exception e) { return null; }
              }
          
              static long vc(PackageInfo p) { return Build.VERSION.SDK_INT >= 28 ? p.getLongVersionCode() : p.versionCode; }
          
              void doDownload(String url, String name, String pkg) {
                  File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "VideoToNote");
                  dir.mkdirs();
                  File part = new File(dir, name + ".part");
                  File dst = new File(dir, name);
                  if (part.exists()) part.delete();
                  long total = -1;
                  Exception last = null;
                  for (int attempt = 1; attempt <= 5; attempt++) {
                      try {
                          long have = part.exists() ? part.length() : 0;
                          HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                          c.setInstanceFollowRedirects(true);
                          c.setConnectTimeout(20000);
                          c.setReadTimeout(30000);
                          c.setRequestProperty("User-Agent", "vtn-uploader");
                          if (have > 0) c.setRequestProperty("Range", "bytes=" + have + "-");
                          int code = c.getResponseCode();
                          if (code != 200 && code != 206) throw new Exception("HTTP " + code);
                          if (code == 200) have = 0;
                          long len = c.getContentLength();
                          if (len > 0) total = have + len;
                          InputStream in = c.getInputStream();
                          FileOutputStream out = new FileOutputStream(part, have > 0);
                          byte[] buf = new byte[65536];
                          long got = have; int n, lastPct = -1;
                          try {
                              while ((n = in.read(buf)) > 0) {
                                  out.write(buf, 0, n); got += n;
                                  int pct = total > 0 ? (int) (got * 100 / total) : -1;
                                  if (pct != lastPct) { lastPct = pct; js("p", String.valueOf(pct)); }
                              }
                          } finally { out.close(); in.close(); }
                          if (total > 0 && part.length() < total) throw new Exception("连接中断，已下载 " + part.length() / 1024 + " KB");
                          last = null;
                          break;
                      } catch (Exception e) {
                          last = e;
                          js("w", "第 " + attempt + " 次下载中断（" + e.getMessage() + "），" + (attempt < 5 ? "3 秒后从断点续传" : "放弃"));
                          try { Thread.sleep(3000); } catch (Exception ignored) {}
                      }
                  }
                  if (last != null) { js("e", "下载失败：" + last.getMessage() + "。检查网络或 VPN 后重试"); return; }
                  if (dst.exists()) dst.delete();
                  if (!part.renameTo(dst)) { js("e", "保存文件失败"); return; }
                  try {
                      PackageManager pm = getPackageManager();
                      PackageInfo ai = pm.getPackageArchiveInfo(dst.getPath(), PackageManager.GET_SIGNATURES);
                      if (ai == null) { js("e", "下载的文件不是有效的 APK"); return; }
                      String note = "APK 版本 " + ai.versionName + "（" + vc(ai) + "）";
                      PackageInfo ii = null;
                      try { ii = pm.getPackageInfo(pkg, PackageManager.GET_SIGNATURES); } catch (Exception ignored) {}
                      if (ii != null) {
                          String s1 = sig(ii), s2 = sig(ai);
                          if (s1 != null && s2 != null && !s1.equals(s2)) js("w", "注意：签名和手机上已装的不一致，直接覆盖会失败。先检查仓库里的 vtn.jks");
                          else note += "，签名一致";
                          if (vc(ai) <= vc(ii)) js("w", "这个 APK 不比已装的新（已装 " + ii.versionName + "）");
                      }
                      js("i", note);
                  } catch (Exception ignored) {}
                  js("dl", dst.getAbsolutePath());
              }
          
              class Bridge {
                  @JavascriptInterface public boolean hasAccess() { return has(); }
          
                  @JavascriptInterface
                  public void requestAccess() {
                      runOnUiThread(new Runnable() { public void run() {
                          try {
                              if (Build.VERSION.SDK_INT >= 30) startActivity(new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + getPackageName())));
                              else requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE, Manifest.permission.WRITE_EXTERNAL_STORAGE}, 1);
                          } catch (Exception e) {
                              try { startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)); } catch (Exception ignored) {}
                          }
                      }});
                  }
          
                  @JavascriptInterface
                  public String listYml() {
                      JSONArray arr = new JSONArray();
                      try {
                          List<File> all = new ArrayList<File>();
                          File[] fs = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS).listFiles();
                          if (fs != null) for (File f : fs) {
                              String n = f.getName().toLowerCase();
                              if (f.isFile() && (n.endsWith(".yml") || n.endsWith(".yaml"))) all.add(f);
                          }
                          Collections.sort(all, new Comparator<File>() { public int compare(File a, File c) {
                              boolean ba = a.getName().toLowerCase().contains("build"), bc = c.getName().toLowerCase().contains("build");
                              if (ba != bc) return ba ? -1 : 1;
                              return Long.compare(c.lastModified(), a.lastModified());
                          }});
                          for (File f : all) {
                              JSONObject o = new JSONObject();
                              o.put("path", f.getAbsolutePath()); o.put("name", f.getName());
                              o.put("size", f.length()); o.put("mtime", f.lastModified());
                              arr.put(o);
                          }
                      } catch (Exception ignored) {}
                      return arr.toString();
                  }
          
                  @JavascriptInterface
                  public String readB64(String path) {
                      try {
                          File f = new File(path);
                          if (!f.isFile() || f.length() == 0 || f.length() > 5 * 1024 * 1024) return "";
                          byte[] buf = new byte[(int) f.length()];
                          FileInputStream in = new FileInputStream(f);
                          try { int off = 0, n; while (off < buf.length && (n = in.read(buf, off, buf.length - off)) > 0) off += n; }
                          finally { in.close(); }
                          return Base64.encodeToString(buf, Base64.NO_WRAP);
                      } catch (Exception e) { return ""; }
                  }
          
                  @JavascriptInterface
                  public String installedInfo(String pkg) {
                      try {
                          PackageInfo p = getPackageManager().getPackageInfo(pkg, PackageManager.GET_SIGNATURES);
                          JSONObject o = new JSONObject();
                          o.put("name", p.versionName); o.put("code", vc(p));
                          String sg = sig(p); o.put("sig", sg == null ? "" : sg.substring(0, 12));
                          return o.toString();
                      } catch (Exception e) { return ""; }
                  }
          
                  @JavascriptInterface
                  public String listApps() {
                      JSONArray arr = new JSONArray();
                      try {
                          PackageManager pm = getPackageManager();
                          Intent i = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
                          List<ResolveInfo> rs = pm.queryIntentActivities(i, 0);
                          for (ResolveInfo r : rs) {
                              JSONObject o = new JSONObject();
                              o.put("pkg", r.activityInfo.packageName);
                              o.put("name", String.valueOf(r.loadLabel(pm)));
                              arr.put(o);
                          }
                      } catch (Exception ignored) {}
                      return arr.toString();
                  }
          
                  @JavascriptInterface
                  public boolean openApp(String pkg) {
                      try {
                          Intent i = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (i == null) return false;
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                          return true;
                      } catch (Exception e) { return false; }
                  }
          
                  @JavascriptInterface
                  public void download(final String url, final String name, final String pkg) {
                      new Thread(new Runnable() { public void run() { doDownload(url, name, pkg); } }).start();
                  }
          
                  @JavascriptInterface
                  public void openUrl(String url) {
                      try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception ignored) {}
                  }
          
                  @JavascriptInterface
                  public void toast(final String m) {
                      runOnUiThread(new Runnable() { public void run() { Toast.makeText(MainActivity.this, m, Toast.LENGTH_SHORT).show(); }});
                  }
          
                  @JavascriptInterface
                  public void keepScreen(final boolean on) {
                      runOnUiThread(new Runnable() { public void run() {
                          if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      }});
                  }
          
                  @JavascriptInterface
                  public void notify(String title, String text, String pkg) {
                      try {
                          NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                          Notification.Builder nb;
                          if (Build.VERSION.SDK_INT >= 26) {
                              nm.createNotificationChannel(new NotificationChannel("build", "编译结果", NotificationManager.IMPORTANCE_DEFAULT));
                              nb = new Notification.Builder(MainActivity.this, "build");
                          } else nb = new Notification.Builder(MainActivity.this);
                          Intent target = null;
                          if (pkg != null && pkg.length() > 0) target = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (target == null) target = new Intent(MainActivity.this, MainActivity.class);
                          PendingIntent pi = PendingIntent.getActivity(MainActivity.this, 0, target, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                          nb.setSmallIcon(android.R.drawable.stat_sys_download_done).setContentTitle(title).setContentText(text).setAutoCancel(true).setContentIntent(pi);
                          nm.notify(1, nb.build());
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF_J
          mkdir -p "$(dirname 'app/src/main/assets/index.html')"
          cat > 'app/src/main/assets/index.html' <<'EOF_H'
          <!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>build 上传助手</title><style>
          :root{--bg:#f3f5f9;--card:#fff;--tx:#111827;--mu:#6b7280;--ln:#e5e7eb;--b:#2563eb;--g:#16a34a;--r:#dc2626;--y:#d97706}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
          .w{max-width:1100px;margin:auto;padding:14px 18px 40px}
          .top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
          .top h1{font-size:20px;margin:0}.ver{font-size:13px;color:var(--mu)}
          .grid{display:grid;grid-template-columns:1fr;gap:14px}
          @media(min-width:820px){.grid{grid-template-columns:1.15fr .85fr}}
          .c{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px #0000000d}
          .c h2{font-size:14px;color:var(--mu);font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
          .steps{display:flex;gap:6px;margin:4px 0 14px}
          .sp{flex:1;text-align:center;font-size:12px;color:var(--mu)}
          .sp i{display:block;height:6px;border-radius:3px;background:var(--ln);margin-bottom:6px}
          .sp.on i{background:var(--b)}.sp.done i{background:var(--g)}.sp.bad i{background:var(--r)}
          .sp.on{color:var(--b);font-weight:600}.sp.done{color:var(--g)}.sp.bad{color:var(--r);font-weight:600}
          #st{font-size:20px;font-weight:700;margin:2px 0 4px}#sub{font-size:13px;color:var(--mu);min-height:18px}
          .bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin-top:10px;display:none}.bar b{display:block;height:100%;width:0;background:var(--b);transition:width .3s}
          .file{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--ln);border-radius:12px;margin-top:14px}
          .file .n{font-weight:600}.file .m{font-size:12px;color:var(--mu)}.file select{flex:1;min-width:0;border:0;font-size:15px;background:none;color:var(--tx)}
          button{border:0;border-radius:12px;padding:11px 14px;font-size:15px;background:#eef0f4;color:var(--tx)}
          button:active{opacity:.7}button:disabled{opacity:.45}
          .main{width:100%;margin-top:12px;padding:15px;font-size:17px;font-weight:700;background:var(--b);color:#fff}
          .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.acts button{background:#eff6ff;color:var(--b);font-size:14px;padding:9px 12px}
          .acts button.pri{background:var(--g);color:#fff;font-weight:600}
          .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}.kv:last-child{border:0}
          .kv span:first-child{color:var(--mu)}.kv span:last-child{text-align:right;max-width:65%;word-break:break-all}
          .row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
          #log{background:#0f172a;color:#e2e8f0;border-radius:12px;padding:10px;font:12.5px/1.6 monospace;max-height:280px;overflow:auto;white-space:pre-wrap;margin-top:8px}
          #log:empty::before{content:"暂无记录";color:#64748b}
          .g{color:#4ade80}.r{color:#f87171}.y{color:#fbbf24}.d{color:#94a3b8}
          label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
          input[type=text],input[type=password],input[type=number],select.f{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;background:#fff}
          .chk{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px;margin:12px 0 0}
          .pill{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600}.ok{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}
          .warn{background:#fff7ed;border:1px solid #fdba74;display:none}
          details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
          .tl{font-size:13px;color:var(--b)}
          </style></head><body><div class="w">
          <div class="top"><h1>build 上传助手</h1><span class="ver" id="tokpill"></span></div>
          <div class="c warn" id="perm" style="margin-bottom:14px"><b>需要文件权限</b><div style="font-size:14px;margin:6px 0 10px">用于读取"下载"里的 build.yml，并把 APK 保存到 下载/VideoToNote。</div><button style="background:#f97316;color:#fff" onclick="App.requestAccess()">去开启</button></div>
          <div class="grid"><div>
          <div class="c">
          <div class="steps"><div class="sp" id="s0"><i></i>上传</div><div class="sp" id="s1"><i></i>编译</div><div class="sp" id="s2"><i></i>下载</div><div class="sp" id="s3"><i></i>打开 DSH GO</div></div>
          <div id="st">准备就绪</div><div id="sub">选好文件后点上传</div><div class="bar" id="bar"><b id="barb"></b></div>
          <div class="file"><div style="flex:1;min-width:0"><select id="f"></select><div class="m" id="newest"></div></div><button onclick="loadFiles(true)">刷新</button></div>
          <button class="main" id="go" onclick="act(run)">上传并编译</button>
          <div class="acts" id="links"></div></div>
          <div class="c" style="margin-top:14px"><details id="logbox"><summary><h2 style="margin:0">运行日志 <span class="tl">展开</span></h2></summary><div id="log"></div></details></div>
          </div><div>
          <div class="c"><h2>视频笔记</h2>
          <div class="kv"><span>手机上</span><span id="iv">读取中…</span></div>
          <div class="kv"><span>线上最新</span><span id="lv">未检查</span></div>
          <div class="kv"><span>已下载</span><span id="dv">无</span></div>
          <div class="row"><button onclick="act(checkLatest)">检查更新</button><button style="background:var(--g);color:#fff" onclick="act(downloadLatest)">下载最新版</button></div></div>
          <div class="c" style="margin-top:14px"><h2>DSH GO</h2>
          <div class="kv"><span>目标应用</span><span id="dshv">未设置</span></div>
          <label>更换目标应用</label><select class="f" id="appsel"></select>
          <div class="row"><button onclick="openDsh(true)">现在打开</button></div></div>
          <div class="c" style="margin-top:14px"><details><summary><h2 style="margin:0">设置 <span class="tl">展开</span></h2></summary>
          <label>GitHub token（需 repo + workflow 写权限）</label><div class="row" style="margin-top:0"><input id="tok" type="password" placeholder="粘贴后点保存"><button style="flex:0 0 auto" onclick="saveTok()">保存</button></div>
          <label>仓库</label><input id="repo" type="text">
          <div class="row" style="margin-top:0"><div><label>分支</label><input id="br" type="text"></div><div><label>最长等待（分钟）</label><input id="to" type="number"></div></div>
          <label>仓库内路径</label><input id="tg" type="text"><label>视频笔记包名</label><input id="pkg" type="text">
          <label class="chk"><input id="auto" type="checkbox">编译成功后自动下载并打开 DSH GO</label>
          <label class="chk"><input id="dry" type="checkbox">试运行（只检查，不提交）</label>
          <button style="margin-top:12px;width:100%" onclick="saveOpt()">保存设置</button></details></div>
          </div></div></div>
          <script>
          const $=i=>document.getElementById(i),API="https://api.github.com",LS=localStorage;
          const DEF={repo:"jlynolson53-hue/VideoToNote-Lite",br:"main",tg:".github/workflows/build.yml",pkg:"com.vtn.lite",to:"25"};
          let busy=false,files=[],apps=[],dlWait=null;
          const kb=n=>(n/1024).toFixed(1)+" KB",sleep=ms=>new Promise(r=>setTimeout(r,ms)),p2=n=>String(n).padStart(2,"0");
          function fmt(t){const d=new Date(t);return p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes())}
          class Fail extends Error{}
          function say(m,c){const d=document.createElement("div");d.className=c||"";d.textContent="["+new Date().toTimeString().slice(0,8)+"] "+m;$("log").appendChild(d);$("log").scrollTop=1e9;if(c=="r")$("logbox").open=true}
          function st(t,sub){$("st").textContent=t;if(sub!==undefined)$("sub").textContent=sub}
          function step(i,state){for(let k=0;k<4;k++){const e=$("s"+k);e.className="sp"+(k<i?" done":k==i?" "+(state||"on"):"")}}
          function bar(p){$("bar").style.display=p==null?"none":"block";$("barb").style.width=(p<0?30:p)+"%"}
          function btn(t,fn,pri){const b=document.createElement("button");b.textContent=t;if(pri)b.className="pri";b.onclick=fn;$("links").appendChild(b)}
          function link(t,u){btn(t,()=>App.openUrl(u))}
          function showTok(){const t=LS.getItem("vtn_tok");$("tokpill").innerHTML=t?'<span class="pill ok">已授权</span>':'<span class="pill no">未设置 token</span>'}
          function saveTok(){const t=$("tok").value.trim();if(!t)return App.toast("先粘贴 token");LS.setItem("vtn_tok",t);$("tok").value="";showTok();App.toast("已保存")}
          function opt(){return JSON.parse(LS.getItem("vtn_opt")||"{}")}
          function loadOpt(){const o=opt();for(const k in DEF)$(k).value=o[k]||DEF[k];$("auto").checked=o.auto!==false}
          function saveOpt(){const o=opt();for(const k in DEF)o[k]=$(k).value.trim();o.auto=$("auto").checked;LS.setItem("vtn_opt",JSON.stringify(o));App.toast("已保存")}
          function dshPkg(){return opt().dsh||""}
          function loadApps(){apps=JSON.parse(App.listApps()).sort((a,b)=>a.name.localeCompare(b.name,"zh"));
           let cur=dshPkg();if(!cur){const h=apps.find(a=>/dsh/i.test(a.name)||/dsh/i.test(a.pkg));if(h){cur=h.pkg;const o=opt();o.dsh=cur;LS.setItem("vtn_opt",JSON.stringify(o))}}
           const s=$("appsel");s.innerHTML='<option value="">（选择应用）</option>';
           apps.forEach(a=>{const e=document.createElement("option");e.value=a.pkg;e.textContent=a.name;s.appendChild(e)});s.value=cur;
           const a=apps.find(x=>x.pkg==cur);$("dshv").textContent=a?a.name:(cur?"未安装："+cur:"未设置，请在下面选择")}
          $("appsel").onchange=()=>{const o=opt();o.dsh=$("appsel").value;LS.setItem("vtn_opt",JSON.stringify(o));loadApps();App.toast("已设为目标应用")};
          function openDsh(manual){const p=dshPkg();if(!p){App.toast("请先选择 DSH GO");return false}
           const ok=App.openApp(p);if(!ok&&manual)App.toast("打不开，请重新选择");return ok}
          function loadFiles(manual){const ok=App.hasAccess();$("perm").style.display=ok?"block":"none";$("perm").style.display=ok?"none":"block";
           const f=$("f");f.innerHTML="";if(!ok){f.innerHTML="<option value=''>未授权</option>";return}
           files=JSON.parse(App.listYml());
           if(!files.length){f.innerHTML="<option value=''>下载文件夹里没有 .yml</option>";$("newest").textContent="";return}
           files.forEach(x=>{const o=document.createElement("option");o.value=x.path;o.textContent=x.name;f.appendChild(o)});f.value=files[0].path;showFile();if(manual)App.toast("已刷新")}
          function showFile(){const x=files.find(y=>y.path==$("f").value);$("newest").textContent=x?kb(x.size)+" · 修改于 "+fmt(x.mtime)+(x==files[0]?" · 最新":""):""}
          $("f").onchange=showFile;
          function showInst(){const s=App.installedInfo($("pkg").value.trim());if(!s){$("iv").textContent="未安装";return}
           const i=JSON.parse(s);$("iv").textContent=i.name+"（"+i.code+"）"}
          window.onAppResume=()=>{showInst();loadApps();if(!busy)loadFiles(false)};
          async function gh(path,o={}){const h={Accept:"application/vnd.github+json",Authorization:"token "+LS.getItem("vtn_tok")};if(o.body)h["Content-Type"]="application/json";
           try{const r=await fetch(API+path,{method:o.method||"GET",headers:h,body:o.body?JSON.stringify(o.body):undefined,cache:"no-store"});let j=null;try{j=await r.json()}catch(e){}return{s:r.status,j}}catch(e){return{s:0,j:{message:String(e)}}}}
          function repo(){return $("repo").value.trim().replace(/^\/|\/$/g,"")}
          async function act(fn){if(busy)return App.toast("正在进行中");busy=true;$("go").disabled=true;$("links").innerHTML="";$("log").innerHTML="";bar(null);
           try{await fn()}catch(e){say(e.message,"r");st("出错了",e.message)}finally{busy=false;$("go").disabled=false;App.keepScreen(false)}}
          async function latestRel(){const r=await gh("/repos/"+repo()+"/releases?per_page=15");if(r.s!=200)throw new Fail("读取发布列表失败（HTTP "+r.s+"）");
           for(const x of r.j){if(x.draft||x.prerelease)continue;const a=(x.assets||[]).find(a=>/\.apk$/i.test(a.name)&&!/BuildUploader/i.test(a.name));if(a)return{rel:x,asset:a}}
           throw new Fail("没找到视频笔记的 APK 发布")}
          async function checkLatest(){st("检查中","");const {rel,asset}=await latestRel();const t=(rel.name||rel.tag_name);
           $("lv").textContent=t;say("线上最新："+t+" · "+asset.name);showInst();st("检查完成",t)}
          window.onNative=(t,m)=>{if(t=="p"){bar(+m);$("sub").textContent=m>=0?"已下载 "+m+"%":"下载中…";return}
           if(t=="dl"){if(dlWait){dlWait({ok:true,path:m});dlWait=null}return}
           say(m,t=="e"?"r":t=="w"?"y":"d");if(t=="e"&&dlWait){dlWait({ok:false,msg:m});dlWait=null}};
          async function downloadLatest(fromBuild){
           if(!App.hasAccess()){App.requestAccess();throw new Fail("需要文件权限才能保存 APK")}
           step(2);st("查找最新版","");const {rel,asset}=await latestRel();const t=rel.name||rel.tag_name;$("lv").textContent=t;
           say("开始下载："+t+" · "+(asset.size/1048576).toFixed(1)+" MB");st("下载中",t);bar(0);App.keepScreen(true);
           const name="VideoToNote-"+(rel.tag_name||"latest")+".apk";
           const res=await new Promise(r=>{dlWait=r;App.download(asset.browser_download_url,name,$("pkg").value.trim());setTimeout(()=>{if(dlWait){dlWait({ok:false,msg:"下载超过 10 分钟"});dlWait=null}},600000)});
           bar(null);if(!res.ok){step(2,"bad");throw new Fail(res.msg)}
           $("dv").textContent=res.path.replace(/^.*\/Download\//,"下载/");say("已保存："+res.path,"g");
           step(3);st("下载完成","已保存到 "+$("dv").textContent);
           btn("打开 DSH GO",()=>openDsh(true),true);
           App.notify("新版视频笔记已下载",t+"，点开进入 DSH GO",dshPkg());
           if(fromBuild!==true||$("auto").checked){if(openDsh(false)){say("已打开 DSH GO","d");step(4)}else say("没有设置或打不开 DSH GO，请在右侧选择","y")}}
          async function run(){
           const path=$("f").value;if(!path)throw new Fail("没有可上传的文件");
           if(!LS.getItem("vtn_tok"))throw new Fail("还没设置 token，请在 设置 里填写");
           const br=$("br").value.trim()||"main",tg=$("tg").value.trim().replace(/^\//,""),R=repo();
           const info=files.find(x=>x.path==path)||{name:path};
           step(0);st("检查文件",info.name);const content=App.readB64(path);if(!content)throw new Fail("读不到文件，或文件是空的");
           const bin=atob(content),raw=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)raw[i]=bin.charCodeAt(i);
           const text=new TextDecoder().decode(raw);say("源文件："+info.name+"（"+kb(raw.length)+"）");
           if(!/^name:\s*\S/m.test(text)||!/^jobs:/m.test(text))throw new Fail("这个文件不像 GitHub Actions 工作流（缺 name: 或 jobs:）");
           const fp="/repos/"+R+"/contents/"+tg.split("/").map(encodeURIComponent).join("/");
           st("对比线上文件");let r=await gh(fp+"?ref="+encodeURIComponent(br)),online=null;
           if(r.s==200)online=r.j;
           else if(r.s==404){const b=await gh("/repos/"+R+"/git/ref/heads/"+encodeURIComponent(br));if(b.s==404)throw new Fail("仓库或分支 '"+br+"' 不存在");say("线上没有此文件，将新建","y")}
           else if(r.s==401||r.s==403)throw new Fail("token 无效或没权限（HTTP "+r.s+"）");
           else if(r.s==0)throw new Fail("连不上 GitHub，请检查网络/VPN");
           else throw new Fail("读取线上文件失败（HTTP "+r.s+"）");
           if(online&&(online.content||"").replace(/\s/g,"")===content){step(0,"done");st("无需上传","线上 build.yml 和这个文件完全一致");say("内容一致，未上传","g");return}
           const now=new Date(),msg="更新 build.yml - "+now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate())+" "+p2(now.getHours())+":"+p2(now.getMinutes());
           say("提交说明："+msg,"d");
           if($("dry").checked){st("试运行完成","未实际提交");return}
           st("上传中");let res=null;
           for(let a=0;a<2;a++){const body={message:msg,content,branch:br};if(online)body.sha=online.sha;
            r=await gh(fp,{method:"PUT",body});if(r.s==200||r.s==201){res=r.j;break}
            const det=r.j&&r.j.message||"";
            if((r.s==409||r.s==422)&&a==0){const r2=await gh(fp+"?ref="+encodeURIComponent(br));if(r2.s==200){online=r2.j;say("线上文件刚被改过，重试一次","y");continue}}
            if(r.s==403&&/personal access token/i.test(det))throw new Fail("token 没有写权限：需要 Contents 和 Workflows 读写权限");
            if(/workflow/i.test(det))throw new Fail("token 缺 workflow 权限");
            throw new Fail("上传失败（HTTP "+r.s+"）："+det)}
           const sha=res.commit.sha;say("上传成功，提交 "+sha.slice(0,7),"g");link("查看提交",res.commit.html_url);
           step(1);st("等待编译","通常 2-10 分钟，请让本 App 留在前台");App.keepScreen(true);
           const t0=Date.now(),dl=t0+(+$("to").value||25)*60000;let last="";
           while(Date.now()<dl){await sleep(10000);
            const q=await gh("/repos/"+R+"/actions/runs?head_sha="+sha+"&per_page=10");if(q.s!=200)continue;
            const rn=(q.j.workflow_runs||[]).find(x=>x.head_sha==sha&&/build/i.test(x.path||x.name||""))||(q.j.workflow_runs||[]).find(x=>x.head_sha==sha);
            const sec=Math.round((Date.now()-t0)/1000),tm=Math.floor(sec/60)+":"+p2(sec%60);
            if(!rn){st("等待编译开始","已等 "+tm);continue}
            st(({queued:"排队中",in_progress:"编译中"}[rn.status]||"编译中"),"已用 "+tm);
            const k=rn.status+"/"+rn.conclusion;if(k==last)continue;last=k;
            if(rn.status=="in_progress"){say("编译中…","d");link("编译日志",rn.html_url)}
            else if(rn.status=="completed"){
             if(rn.conclusion=="success"){say("编译成功，用时 "+tm,"g");
              if($("auto").checked){await sleep(3000);await downloadLatest(true)}
              else{step(2);st("编译成功","点下面按钮下载");btn("下载最新版",()=>act(downloadLatest),true);App.notify("编译成功","打开上传助手下载","")}
              return}
             step(1,"bad");st("编译失败",rn.conclusion);link("失败日志",rn.html_url);App.notify("编译失败","打开查看日志","");return}}
           st("等待超时","可到 Actions 页面看进度");link("Actions 页面","https://github.com/"+R+"/actions")}
          loadOpt();showTok();loadFiles(false);showInst();loadApps();
          </script></body></html>
          EOF_H

      - name: Signing key (fixed, created once)
        shell: bash
        run: |
          if [ ! -f up.jks ]; then
            keytool -genkeypair -keystore up.jks -alias up -keyalg RSA -keysize 2048 -validity 36500 -storepass uploader123 -keypass uploader123 -dname "CN=BuildUploader"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add up.jks
            git commit -m "add fixed signing key [skip ci]"
            git push
          fi
      - name: Build APK
        shell: bash
        env:
          RUN_NO: ${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BuildUploader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BuildUploader
          path: BuildUploader.apk
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NO: ${{ github.run_number }}
        run: |
          gh release create "uploader-1.0.$RUN_NO" BuildUploader.apk --prerelease --title "build上传助手 1.0.$RUN_NO" --notes "build上传助手自动构建（预发布，不影响视频笔记的 latest）"
