              private JSONArray lvEmbSubs(Uri u, int ti) throws Exception {
                  android.media.MediaExtractor ex = new android.media.MediaExtractor();
                  ex.setDataSource(MainActivity.this, u, null);
                  String mime = ex.getTrackFormat(ti).getString(android.media.MediaFormat.KEY_MIME);
                  ex.selectTrack(ti);
                  java.nio.ByteBuffer bb = java.nio.ByteBuffer.allocate(1 << 18);
                  JSONArray out = new JSONArray(); JSONObject last = null;
                  while (true) {
                      bb.clear();
                      int n = ex.readSampleData(bb, 0); if (n < 0) break;
                      double t = ex.getSampleTime() / 1e6;
                      byte[] b = new byte[n]; bb.position(0); bb.get(b, 0, n);
                      String s;
                      if (mime.contains("3gpp") && n >= 2) { int len = ((b[0] & 255) << 8) | (b[1] & 255); s = new String(b, 2, Math.min(len, n - 2), "UTF-8"); }
                      else s = new String(b, 0, n, "UTF-8");
                      if (mime.contains("ssa")) { String[] p = s.split(",", 9); s = p[p.length - 1]; }
                      s = s.replaceAll("\\{[^}]*\\}", "").replaceAll("<[^>]+>", "").replace("\\N", " ").replace("\\n", " ").trim();
                      if (last != null && t > last.getDouble("from") && t < last.getDouble("to")) last.put("to", t);
                      if (s.length() > 0) { JSONObject o = new JSONObject(); o.put("from", t); o.put("to", t + 4); o.put("text", s); out.put(o); last = o; }
                      ex.advance();
                  }
                  ex.release();
                  return out;
              }
