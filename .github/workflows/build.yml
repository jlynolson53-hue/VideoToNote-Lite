          :root[data-theme=dark]{--primary:#111111;--on-primary:#fff;--primary-container:#2c2c2e;--on-primary-container:#ffffff;--secondary-container:#2c2c2e;--on-secondary-container:#ffffff;--background:#000;--surface:#1C1C1E;--surface-container-low:#1C1C1E;--surface-container:#1C1C1E;--surface-container-high:#2C2C2E;--on-surface:#fff;--on-surface-variant:#8E8E93;--outline:#38383A;--outline-variant:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--sep:rgba(84,84,88,.65);--green:#30D158}
          html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Noto Sans CJK SC",sans-serif!important;-webkit-font-smoothing:antialiased}
          body{background:var(--background)!important}
          h1.hd{font-size:34px!important;font-weight:700!important;margin:8px 4px 14px!important}
          h2{font-size:20px!important;font-weight:600!important}
          .card,.grp,details.card{background:var(--surface)!important;border:none!important;border-radius:12px!important;box-shadow:none!important}
          .gt{font-size:13px!important;color:var(--on-surface-variant)!important;font-weight:400!important;margin:22px 16px 6px!important}
          .li{border-bottom:.5px solid var(--sep);min-height:44px}.li:last-child{border-bottom:none}
          label{color:var(--on-surface-variant)!important;font-size:13px!important}
          input,textarea,select{background:var(--fill)!important;border:none!important;border-radius:10px!important;font-size:17px!important;color:var(--on-surface)!important}
          input:focus,textarea:focus,select:focus{outline:none!important;box-shadow:0 0 0 3px rgba(0,0,0,.25)!important}
          button{border-radius:12px!important;font-weight:600!important;box-shadow:none!important;transition:opacity .15s,transform .15s}
          button:active{opacity:.6;transform:scale(.98)}
          button.big{background:var(--primary)!important;color:#fff!important;min-height:50px;font-size:17px!important}
          button.sec,button.ghost{background:var(--fill)!important;color:var(--primary)!important;border:none!important}
          button.text{background:none!important;color:var(--primary)!important}
          button.icon{border-radius:50%!important;color:var(--primary)!important;background:none!important}
          .chip5,.pills button{border-radius:999px!important;border:none!important;background:var(--fill)!important;color:var(--on-surface)!important;font-weight:500!important}
          .chip5.on,.pills button.on{background:var(--primary)!important;color:#fff!important}
          .chip5.on::before{display:none!important}
          .seg{background:var(--fill)!important;border:none!important;border-radius:9px!important;padding:2px!important}
          .seg button{border:none!important;border-radius:7px!important;background:none!important;color:var(--on-surface)!important;font-weight:500!important}
          .seg button.on{background:var(--surface)!important;box-shadow:0 3px 8px rgba(0,0,0,.12)!important}
          :root[data-theme=dark] .seg button.on{background:#636366!important}
          .sw i{width:51px!important;height:31px!important;border-radius:16px!important;background:var(--fill)!important;border:none!important}
          .sw i::after{width:27px!important;height:27px!important;top:2px!important;left:2px!important;background:#fff!important;border-radius:50%!important;box-shadow:0 3px 8px rgba(0,0,0,.15)!important;transform:none!important;transition:left .25s!important}
          .sw input:checked+i{background:var(--green)!important}
          .sw input:checked+i::after{left:22px!important}
          .nav{background:rgba(242,242,247,.8)!important;-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-right:.5px solid var(--sep)!important;box-shadow:none!important}
          :root[data-theme=dark] .nav{background:rgba(28,28,30,.8)!important}
          .nav button{color:var(--on-surface-variant)!important;font-weight:500!important}
          .nav button.on{color:var(--primary)!important}
          .nav .pill,.nav button.on .pill{background:none!important}
          .appbar{background:rgba(242,242,247,.85)!important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep)}
          :root[data-theme=dark] .appbar{background:rgba(28,28,30,.85)!important}
          .rpl{display:none!important}
          .fab{border-radius:999px!important;background:var(--primary)!important;color:#fff!important;box-shadow:0 8px 24px rgba(0,0,0,.3)!important}
          #snack{border-radius:14px!important}
          .pvTop{display:flex;align-items:center;gap:10px}.pvTop h2{flex:1;margin:0}
          #pvPause{min-width:76px;padding:6px 14px}
          #pvPause.paused{background:var(--green)!important;color:#fff!important}
          #pvFlow{display:flex;align-items:flex-start;margin:18px 0 10px}
          .pvS{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;font-size:12px;color:var(--on-surface-variant)}
          .pvS::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--fill)}
          .pvS:first-child::before{display:none}
          .pvS.done::before,.pvS.cur::before{background:var(--primary)}
          .pvS i{width:28px;height:28px;border-radius:50%;background:var(--surface-container-high);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:600;z-index:1;margin-bottom:6px;transition:all .3s}
          .pvS.done i{background:var(--primary);color:#fff}
          .pvS.cur i{background:var(--surface);color:var(--primary);box-shadow:0 0 0 3px var(--primary);animation:pvp 1.4s infinite}
          .pvS.cur{color:var(--primary);font-weight:600}
          .paused .pvS.cur i{animation:none;box-shadow:0 0 0 3px #FF9500;color:#FF9500}
          @keyframes pvp{50%{box-shadow:0 0 0 7px rgba(0,0,0,.2)}}
          .pvStats{display:flex;gap:10px;margin:8px 0}
          .pvStats div{flex:1;background:var(--fill);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
          .pvStats b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
          .pvStats span{font-size:12px;color:var(--on-surface-variant)}
          #pvNow{font-size:13px;min-height:18px;margin:4px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          /* v1.6.7：默认纯色；自定义背景时卡片变玻璃；侧边栏融入背景 */
          html.has-bg body{background:transparent!important}
          #bgLayer{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat;display:none}
          html.has-bg #bgLayer{display:block}
          .pvStats>div{border-radius:16px!important}
          @media (min-width:841px){
            .nav{background:var(--background)!important;border:none!important;box-shadow:none!important;-webkit-backdrop-filter:none;backdrop-filter:none}
            html.has-bg .nav{background:transparent!important}
            .nav button.on .pill{background:var(--fill)!important;border-radius:14px!important}
          }
          /* v1.7.6：界面细调（按 Refactoring UI：组内紧、组间松，一个主操作） */
          .wrap{max-width:900px!important}
          h1.hd{letter-spacing:-.5px}
          .card,.grp{padding:22px 24px!important;margin-bottom:20px!important}
          #genCard label,.grp label{margin:22px 0 8px!important;font-size:13px!important;font-weight:500!important;letter-spacing:.2px}
          #genCard>label:first-of-type,.grp>label:first-child{margin-top:0!important}
          #genCard textarea#input{min-height:96px;line-height:1.5;padding:14px 16px!important}
          #genCard input,.grp input{padding:12px 14px!important;min-height:48px}
          .chips{gap:10px!important;margin:0!important}
          .chip5{height:38px!important;min-height:38px!important;padding:0 18px!important;font-size:15px!important}
          .chip5.on{box-shadow:0 2px 6px rgba(0,0,0,.25)!important}
          details.req{margin-top:22px!important;padding:6px 16px 12px!important;border-radius:14px!important;background:var(--fill)!important;border:none!important}
          details.req textarea{background:var(--surface)!important}
          .pills button{height:34px!important;min-height:34px!important;font-size:14px!important;color:var(--on-surface-variant)!important}
          #goBtn{margin-top:26px!important;min-height:54px!important;border-radius:14px!important;font-size:18px!important;box-shadow:0 6px 18px rgba(0,0,0,.28)!important}
          #subOnly{display:block;width:100%;margin-top:6px!important;font-weight:500!important}
          .pvStats b{font-variant-numeric:tabular-nums;font-size:30px!important;font-weight:700!important}
          .pvStats>div{padding:16px 18px!important}
          #pvTime{font-variant-numeric:tabular-nums}
          .gt{margin:28px 20px 8px!important;font-size:13px!important}
          .hist{border-radius:14px!important;transition:transform .15s}
          .hist:active{transform:scale(.99)}
          .grp button+button{margin-left:8px}
          /* v1.7.7：UI 动效（克制，无模糊） */
          :root{--ease-spring:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(.22,1,.36,1)}
          @keyframes vIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
          @keyframes vPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
          @keyframes vPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,.45)}50%{box-shadow:0 0 0 7px rgba(0,0,0,0)}}
          @keyframes vFlash{0%{box-shadow:0 0 0 0 rgba(0,0,0,.6)}100%{box-shadow:0 0 0 10px rgba(0,0,0,0)}}
          .page.on{animation:vIn .32s var(--ease-out) both}
          .page.on .grp,.page.on .card,.page.on .hist{animation:vIn .38s var(--ease-out) both}
          .page.on>*:nth-child(2){animation-delay:.03s}.page.on>*:nth-child(3){animation-delay:.06s}
          .page.on>*:nth-child(4){animation-delay:.09s}.page.on>*:nth-child(5){animation-delay:.12s}
          .hist:nth-child(2){animation-delay:.04s}.hist:nth-child(3){animation-delay:.08s}.hist:nth-child(4){animation-delay:.12s}.hist:nth-child(n+5){animation-delay:.16s}
          button,.chip5,.chip,.fab,.big{transition:transform .28s var(--ease-spring),background-color .2s,color .2s,box-shadow .2s,opacity .2s}
          button:active,.chip5:active,.chip:active,.fab:active{transform:scale(.95);transition-duration:.08s}
          .big:active{transform:scale(.97)}
          details>*:not(summary){animation:vIn .25s var(--ease-out)}
          summary{transition:color .2s}
          #progCard:not([hidden]){animation:vPop .35s var(--ease-spring)}
          #pvFlow .on,#pvFlow .cur,#pvFlow .act,.steps .on{animation:vPulse 1.6s ease-in-out infinite}
          #pvPct,#pvReq,#pvRun{transition:color .3s}
          #snack{transition:transform .32s var(--ease-spring),opacity .2s!important}
          #snack:not(.show){transform:translate(-50%,24px)}
          .menu.show,.sheet.show,#dlg.show,.pop.show{animation:vPop .22s var(--ease-out)}
          #scrim{transition:opacity .2s}
          .nav a,.nav button,.nav .it{transition:background-color .25s,color .25s,transform .28s var(--ease-spring)}
          #input.vflash{animation:vFlash .7s ease-out}
          @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
          </style>
          </head>
          <body>
          <span id="themeChip" hidden></span><span id="loginChip" hidden></span>

          <div class="page on" id="pg-gen"><div class="wrap">
            <h1 class="hd">FrameNote</h1>
            <div class="card" id="genCard">
              <label for="input">B站链接或分享文字</label>
              <div class="frow"><textarea id="input" rows="2" placeholder="支持 b23.tv 短链、BV号、完整链接"></textarea>
                <button class="icon" id="pasteBtn" title="粘贴"><i class="ic" data-fb="粘贴">content_paste</i></button></div>
              <label>分P（留空=自动识别）</label><input id="pnum" type="number" min="1" placeholder="自动" style="max-width:200px">
              <select id="style" style="display:none"><option value="study">教辅模式</option><option value="brief">简要摘要</option><option value="detail">详细逐段</option></select>
              <label>笔记风格</label><div class="chips" id="styleChips"></div>
              <label>选项</label><div class="chips"><button class="chip5" id="chipTs">显示时间戳</button><button class="chip5" id="chipShot">截图笔记</button></div>
              <label class="sw" style="display:none"><span>笔记中显示时间戳<small id="tsTip"></small></span><input type="checkbox" id="tsOn"><i></i></label>
              <details class="req" id="reqBox">
                <summary>我的要求<em id="reqOn"></em><label class="sw rsw" id="reqSw" title="启用/关闭我的要求"><input type="checkbox" id="reqEn"><i></i></label></summary>
                <textarea id="req" placeholder="例如：这是高三物理复习课，重点整理解题方法；每个知识点后面列出易错点；最后出3道自测题。"></textarea>
                <div class="pills" id="pills">
                  <button>标出高考考点</button><button>列出易错点</button><button>例题写完整解题步骤</button>
                  <button>保留老师的口诀和技巧</button><button>相似概念用表格对比</button><button>末尾出3道自测题（附答案）</button>
                  <button>语言尽量简洁</button>
                </div>
                <button class="text" id="reqClear">清空</button>
                <div class="mute" style="margin-bottom:8px">点上面的芯片可以快速添加。内容自动保存，以后每次生成都会用上。</div>
              </details>
              <button id="goBtn" class="big"><i class="ic" data-fb="">auto_awesome</i> 生成笔记</button>
              <button class="text" id="subOnly">只提取字幕</button>
            </div>
            <div class="card" id="progCard" style="display:none">
              <div class="pvTop"><h2 id="pvTitle">正在生成</h2><span id="pvTime" class="mute">00:00</span><button class="sec" id="pvPause">暂停</button></div>
              <div id="pvFlow"></div>
              <div class="pvStats"><div><b id="pvReq">0</b><span>已完成请求</span></div><div><b id="pvRun">0</b><span>进行中</span></div><div><b id="pvPct">0%</b><span>总进度</span></div></div>
              <div id="pvNow" class="mute"></div>
              <ol id="steps"></ol>
              <div id="progErr"></div>
              <div class="busy" id="busy"></div>
            </div>
            <details class="card" id="logBox"><summary>运行日志</summary><div id="log"></div></details>
            <div id="hint" style="display:none"></div>
          </div></div>

          <div class="page" id="pg-lib"><div class="wrap">
            <h1 class="hd">笔记库</h1>
            <div class="search"><i class="ic" data-fb="">search</i><input id="libQ" placeholder="搜索标题或正文"></div>
            <div id="hist"></div>
          </div></div>

          <div class="page" id="pg-set"><div class="wrap">
            <h1 class="hd">设置</h1>
            <div class="gt">AI 模型与 API Key</div>
            <div class="grp" id="setBox">
              <label>接口地址（OpenAI 兼容）</label><input id="base" placeholder="https://api.deepseek.com">
              <label>模型名</label><input id="model" placeholder="deepseek-flash">
              <label>API Key</label><div class="pw"><input id="key" type="password" placeholder="sk-..."><button class="icon eye" data-for="key"><i class="ic" data-fb="显示">visibility</i></button></div>
              <button id="saveSet">保存设置</button><button class="sec" id="testSet">测试连接</button><button class="sec" id="balBtn">查询余额</button>
              <p class="mute" id="balTxt"></p>
              <p class="mute">Key 只保存在本机，不会上传到别处。</p>
            </div>
            <div class="gt">截图识图 / 语音转写</div>
            <div class="grp" id="grpShot"></div>
            <div class="gt">B站账号</div>
            <div class="grp">
              <div id="loginState" class="mute" style="padding-top:8px">检测中…</div>
              <button id="loginBtn">登录B站</button><button class="sec" id="logoutBtn">退出登录</button>
              <p class="mute">B站的 AI 字幕通常要登录才能获取。登录成功后按“返回”键回到本应用。</p>
            </div>
            <div class="gt">外观</div>
            <div class="grp">
              <label>主题模式</label>
              <div class="seg" id="themeSeg"><button data-m="light">浅色</button><button data-m="dark">深色</button><button data-m="auto">跟随系统</button></div>
              <label>主题色</label><div class="chips" id="seedChips"></div>
            </div>
            <div class="gt">关于</div>
            <div class="grp"><div class="li"><span>版本</span><span class="mute" id="verTxt">1.6.2</span></div><div class="mute">FrameNote</div><details id="chgBox" style="margin-top:8px"><summary><b>更新日志</b></summary><div id="chgList" class="mute"></div></details></div>
          </div></div>

          <div id="pg-det">
            <div class="appbar"><button class="icon" id="detBack"><i class="ic" data-fb="返回">arrow_back</i></button><div class="abt" id="detTitle"></div><button class="icon" id="detMore"><i class="ic" data-fb="更多">more_vert</i></button></div>
            <div class="wrap">
              <div class="card" id="resCard" style="display:none">
                <h2 id="resTitle">结果</h2>
                <div class="bar" style="display:none">
                  <button id="bSave">保存笔记</button><button class="ghost" id="bShare">分享</button>
                  <details id="more"><summary>更多</summary><div class="menu">
                    <button class="sec" id="tPrev">预览模式</button><button class="sec" id="tSrc">编辑源码</button>
                    <button class="sec" id="bCopy">复制全文</button><button class="sec" id="bSrt">保存字幕 .srt</button>
                  </div></details>
                </div>
                <div id="preview"></div>
                <textarea id="source" style="display:none"></textarea>
              </div>
            </div>
            <button class="fab" id="fab"><i class="ic" data-fb="">edit</i>修改笔记</button>
          </div>

          <div class="nav">
            <button class="on" data-p="gen"><span class="pill"><i class="ic" data-fb="生">auto_awesome</i></span>生成</button>
            <button data-p="lib"><span class="pill"><i class="ic" data-fb="库">library_books</i></span>笔记库</button>
            <button data-p="set"><span class="pill"><i class="ic" data-fb="设">settings</i></span>设置</button>
          </div>

          <div id="scrim"></div>
          <div id="sheet"><div class="handle"></div><h2>修改笔记</h2>
            <p class="mute">写下修改意见，AI 会基于已保存的材料和当前这一版重写，不会重新截图或取字幕。</p>
            <div id="sheetBody"></div><div class="lin" id="sheetLin" style="display:none"><i></i></div></div>
          <div id="pop"></div>
          <div id="snack"></div>
          <div id="dlg"><h3><i class="ic" data-fb="!">error</i>出错了</h3><div id="dlgTxt"></div><div style="text-align:right;margin-top:16px"><button class="text" id="dlgOk">知道了</button></div></div>
          <div id="viewer"><img alt=""><button class="icon vclose"><i class="ic" data-fb="关">close</i></button></div>
          <script>
          "use strict";
          const $ = id => document.getElementById(id);
          const HAS_NATIVE = typeof window.Native !== "undefined";

          const cbs = {}; let seq = 0;
          window.__nativeCb = (id, s) => { const f = cbs[id]; delete cbs[id]; if (f) f(JSON.parse(s)); };
          function http(method, url, headers, body) {
            return new Promise((res, rej) => {
              if (!HAS_NATIVE) { rej(new Error("请在安卓应用里运行")); return; }
              const id = "r" + (++seq);
              cbs[id] = r => r.error ? rej(new Error("网络错误：" + r.error)) : res(r);
              Native.request(id, method, url, JSON.stringify(headers || {}), body || "");
            });
          }

          function log(msg, cls) { const d = document.createElement("div"); if (cls) d.className = cls; d.textContent = msg; $("log").appendChild(d); $("log").scrollTop = 1e9; }

          const S = { base: "https://api.deepseek.com", model: "deepseek-flash", key: "" };
          try { Object.assign(S, JSON.parse(localStorage.getItem("vtn_set") || "{}")); } catch (e) {}
          $("base").value = S.base; $("model").value = S.model; $("key").value = S.key;
          if (!S.key) $("setBox").open = true;
          $("saveSet").onclick = () => {
            S.base = $("base").value.trim() || "https://api.deepseek.com";
            S.model = $("model").value.trim() || "deepseek-flash";
            S.key = $("key").value.trim();
            localStorage.setItem("vtn_set", JSON.stringify(S));
          };
          $("testSet").onclick = async () => {
            $("saveSet").onclick();
            try { const t = await chat([{ role: "user", content: "只回复四个字：连接成功" }]); alert("模型回复：" + t); }
            catch (e) { alert(e.message); }
          };

          function refreshLogin() {
            if (!HAS_NATIVE) { $("loginState").textContent = "（浏览器预览模式，无法登录）"; return; }
            const ok = Native.hasLogin();
            $("loginState").textContent = ok ? "已登录，可以获取 AI 字幕" : "未登录";
            $("loginState").style.color = ok ? "var(--ok)" : "var(--mute)";
          }
          $("loginBtn").onclick = () => HAS_NATIVE && Native.openLogin();
          $("logoutBtn").onclick = () => { if (HAS_NATIVE) { Native.logout(); setTimeout(refreshLogin, 500); } };
          refreshLogin();

          const BH = {
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
            "Referer": "https://www.bilibili.com/"
          };
          async function bget(url) {
            const r = await http("GET", url, BH);
            let j; try { j = JSON.parse(r.body); } catch (e) { throw new Error("B站返回了看不懂的内容（状态码 " + r.status + "）"); }
