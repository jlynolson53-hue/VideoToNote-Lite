              private boolean lvOnPick(final int req, final int res, final Intent data) {
                  if (req < 7302 || req > 7304) return false;
                  final String id = lvPickId; lvPickId = null;
                  if (id == null) return true;
                  final java.util.ArrayList<Uri> us = new java.util.ArrayList<>();
                  if (res == RESULT_OK && data != null) {
                      if (data.getClipData() != null) { for (int i = 0; i < data.getClipData().getItemCount(); i++) us.add(data.getClipData().getItemAt(i).getUri()); }
                      else if (data.getData() != null) us.add(data.getData());
                  }
                  new Thread(() -> {
                      JSONObject r = new JSONObject();
                      try {
                          if (us.isEmpty()) r.put("cancel", true);
                          else if (req == 7302) r = lvImport(us);
                          else if (req == 7303) r = lvVideoInfo(us.get(0));
                          else { r.put("name", lvName(us.get(0))); r.put("text", new String(lvRead(us.get(0)), "UTF-8")); }
                      } catch (Throwable e) { try { r.put("error", String.valueOf(e.getMessage())); } catch (Exception ig) { } }
                      reply(id, r);
                  }).start();
