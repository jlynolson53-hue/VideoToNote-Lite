                                  if (s != null) out[0] = s.toString();
                              }
                          } catch (Exception e) { }
                          latch.countDown();
                      });
                      try { latch.await(2, java.util.concurrent.TimeUnit.SECONDS); } catch (InterruptedException e) { }
                      return out[0];
                  }

