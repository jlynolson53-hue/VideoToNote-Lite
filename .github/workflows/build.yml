              public static class KeepService extends android.app.Service {
                  private android.os.PowerManager.WakeLock wl;
                  @Override public android.os.IBinder onBind(Intent i) { return null; }
                  @Override public int onStartCommand(Intent i, int flags, int startId) {
                      String t = i != null ? i.getStringExtra("t") : null;
                      if (t == null) t = "正在生成笔记";
                      android.app.NotificationManager nm = (android.app.NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      android.app.Notification.Builder nb;
                      if (android.os.Build.VERSION.SDK_INT >= 26) {
                          nm.createNotificationChannel(new android.app.NotificationChannel("work", "后台生成", android.app.NotificationManager.IMPORTANCE_LOW));
                          nb = new android.app.Notification.Builder(this, "work");
                      } else nb = new android.app.Notification.Builder(this);
                      Intent open = new Intent(this, MainActivity.class);
                      open.setAction(Intent.ACTION_MAIN);
                      open.addCategory(Intent.CATEGORY_LAUNCHER);
                      android.app.PendingIntent pi = android.app.PendingIntent.getActivity(this, 0, open,
                          android.app.PendingIntent.FLAG_IMMUTABLE | android.app.PendingIntent.FLAG_UPDATE_CURRENT);
                      nb.setSmallIcon(getApplicationInfo().icon).setContentTitle("视频笔记").setContentText(t + "，可以切到后台")
                        .setOngoing(true).setContentIntent(pi);
                      if (android.os.Build.VERSION.SDK_INT >= 29)
                          startForeground(1, nb.build(), android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                      else startForeground(1, nb.build());
                      if (wl == null) {
                          android.os.PowerManager pm = (android.os.PowerManager) getSystemService(Context.POWER_SERVICE);
                          wl = pm.newWakeLock(android.os.PowerManager.PARTIAL_WAKE_LOCK, "vtn:work");
                          wl.acquire(3L * 60 * 60 * 1000);
                      }
                      return START_NOT_STICKY;
                  }
                  @Override public void onDestroy() {
                      if (wl != null && wl.isHeld()) wl.release();
                      wl = null;
                      super.onDestroy();
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);
                  web.setWebViewClient(new WebViewClient() {
