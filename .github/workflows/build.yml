                                          reply(id, r); end();
                                      }
                                      @Override public void err(String e) {
                                          JSONObject r = new JSONObject(); try { r.put("error", "写入 PDF 失败：" + e); } catch (Exception ignored) { }
                                          reply(id, r); end();
                                      }
                                  });
                              } catch (Throwable e) {
                                  JSONObject r = new JSONObject(); try { r.put("error", "写入 PDF 失败：" + e); } catch (Exception ignored) { }
                                  reply(id, r); end();
                              }
                          });
                      }
                  }

