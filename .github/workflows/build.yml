                      int n = 0;
                      try {
                          JSONArray a = new JSONArray(namesJson);
                          File dir = new File(getFilesDir(), "img");
                          for (int i = 0; i < a.length(); i++) {
                              String name = a.getString(i);
                              File src = new File(dir, name);
                              if (!src.exists()) continue;
                              byte[] data = readFile(src);
                              if (Build.VERSION.SDK_INT >= 29) {
                                  ContentValues v = new ContentValues();
                                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                                  v.put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg");
                                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/VideoToNote/img");
                                  Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                                  OutputStream o = getContentResolver().openOutputStream(u);
                                  o.write(data);
                                  o.close();
                              } else {
                                  File d2 = new File(getExternalFilesDir(null), "img");
                                  d2.mkdirs();
                                  FileOutputStream o = new FileOutputStream(new File(d2, name));
                                  o.write(data);
                                  o.close();
                              }
                              n++;
                          }
                      } catch (Exception ignored) { }
                      return n;
                  }

                  @JavascriptInterface
                  public void transcribe(final String id, final String audioUrl, final String key, final String model, final int chunkSec) {
                      new Thread(() -> {
                          JSONObject r = new JSONObject();
                          File cache = new File(getCacheDir(), "audio.m4s");
                          ArrayList<File> files = new ArrayList<>();
                          try {
                              prog(id, "正在下载音频…");
                              HttpURLConnection c = (HttpURLConnection) new URL(audioUrl).openConnection();
                              c.setConnectTimeout(20000);
                              c.setReadTimeout(120000);
                              c.setRequestProperty("User-Agent", UA);
                              c.setRequestProperty("Referer", "https://www.bilibili.com/");
                              int code = c.getResponseCode();
                              if (code >= 400) throw new Exception("音频下载失败（状态码 " + code + "）");
                              InputStream in = c.getInputStream();
                              FileOutputStream fo = new FileOutputStream(cache);
                              byte[] buf0 = new byte[65536];
                              long total = 0, nextReport = 2L << 20;
                              int n;
                              while ((n = in.read(buf0)) > 0) {
                                  fo.write(buf0, 0, n);
                                  total += n;
                                  if (total >= nextReport) {
                                      prog(id, "已下载音频 " + (total >> 20) + " MB");
                                      nextReport += 2L << 20;
                                  }
                              }
                              fo.close();
                              in.close();

                              prog(id, "正在切分音频…");
                              MediaExtractor ex = new MediaExtractor();
                              ex.setDataSource(cache.getAbsolutePath());
                              int tr = -1;
                              MediaFormat fmt = null;
                              for (int i = 0; i < ex.getTrackCount(); i++) {
                                  MediaFormat f = ex.getTrackFormat(i);
                                  String m = f.getString(MediaFormat.KEY_MIME);
                                  if (m != null && m.startsWith("audio/")) { tr = i; fmt = f; break; }
                              }
                              if (tr < 0) throw new Exception("音频里没有找到音轨");
                              ex.selectTrack(tr);
                              ByteBuffer buf = ByteBuffer.allocate(1 << 20);
                              MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();
                              MediaMuxer mux = null;
                              int mt = -1;
                              long first = 0, lastT = 0, chunkUs = chunkSec * 1000000L;
                              ArrayList<Double> starts = new ArrayList<>();
                              ArrayList<Double> ends = new ArrayList<>();
                              while (true) {
                                  int size = ex.readSampleData(buf, 0);
                                  if (size < 0) break;
                                  long t = ex.getSampleTime();
                                  if (mux == null || t - first >= chunkUs) {
                                      if (mux != null) { mux.stop(); mux.release(); ends.add(lastT / 1e6); }
                                      File cf = new File(getCacheDir(), "asr_" + files.size() + ".m4a");
                                      mux = new MediaMuxer(cf.getAbsolutePath(), MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                                      mt = mux.addTrack(fmt);
                                      mux.start();
                                      first = t;
                                      files.add(cf);
                                      starts.add(t / 1e6);
                                  }
                                  info.set(0, size, t - first, MediaCodec.BUFFER_FLAG_KEY_FRAME);
                                  mux.writeSampleData(mt, buf, info);
                                  lastT = t;
                                  ex.advance();
                              }
                              if (mux != null) { mux.stop(); mux.release(); ends.add(lastT / 1e6); }
                              ex.release();
                              if (files.isEmpty()) throw new Exception("音频是空的");

                              JSONArray segs = new JSONArray();
                              for (int i = 0; i < files.size(); i++) {
                                  prog(id, "语音识别 " + (i + 1) + "/" + files.size() + " …");
                                  String txt = null;
                                  Exception last = null;
                                  for (int k = 0; k < 3 && txt == null; k++) {
                                      try { txt = uploadAsr(files.get(i), key, model); }
                                      catch (Exception e) {
                                          last = e;
                                          if (String.valueOf(e.getMessage()).contains("Key")) break;
                                          try { Thread.sleep(2000L * (k + 1)); } catch (Exception ignored) { }
                                      }
                                  }
                                  if (txt == null) throw last;
                                  JSONObject s = new JSONObject();
                                  s.put("from", starts.get(i));
                                  s.put("to", ends.get(i));
                                  s.put("text", txt);
                                  segs.put(s);
                              }
                              r.put("segs", segs);
                          } catch (Exception e) {
                              try { r.put("error", e.getMessage() == null ? e.toString() : e.getMessage()); } catch (Exception ignored) { }
                          } finally {
                              cache.delete();
                              for (File f : files) f.delete();
                          }
                          reply(id, r);
                      }).start();
                  }
              }
          }
          VTN_EOF
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 https://unpkg.com/pagedjs@0.4.3/dist/paged.polyfill.js -o app/src/main/assets/paged.polyfill.js || curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/pagedjs@0.4.3/dist/paged.polyfill.js -o app/src/main/assets/paged.polyfill.js
          test -s app/src/main/assets/paged.polyfill.js
          mkdir -p app/src/main/assets/fonts
          NS=https://unpkg.com/@fontsource/noto-serif-sc@5.3.1
          if curl -fsSL --retry 3 "$NS/400.css" -o /tmp/ns.css; then
            grep -o 'noto-serif-sc-[0-9]*-400-normal\.woff2' /tmp/ns.css | sort -u > /tmp/nsl.txt
            xargs -P 8 -I{} curl -fsSL --retry 3 "$NS/files/{}" -o "app/src/main/assets/fonts/{}" < /tmp/nsl.txt || true
            sed -e 's#url(./files/#url(#g' -e 's#, url([^)]*\.woff) format(.woff.)##g' /tmp/ns.css > app/src/main/assets/fonts/serif.css
            n=$(ls app/src/main/assets/fonts/*.woff2 | wc -l); echo "宋体分片 $n 个"; test "$n" -gt 80
          else
            echo "/* 宋体下载失败，使用系统字体 */" > app/src/main/assets/fonts/serif.css
          fi
          mkdir -p app/src/main/assets && python3 web/assemble.py app/src/main/assets/index.html && python3 tools/check.py app/src/main/assets/index.html

      - name: Fetch KaTeX
        run: |
          curl -fsSL https://registry.npmjs.org/katex/-/katex-0.16.11.tgz -o katex.tgz
          tar xzf katex.tgz
          mkdir -p app/src/main/assets/katex
          cp package/dist/katex.min.js package/dist/katex.min.css app/src/main/assets/katex/
          cp -r package/dist/fonts app/src/main/assets/katex/
          rm -rf package katex.tgz
          ls app/src/main/assets/katex

      - name: Fetch Material Symbols (from BeerCSS)
        run: |
          curl -fsSL https://registry.npmjs.org/beercss/-/beercss-5.0.3.tgz -o beer.tgz
          tar xzf beer.tgz
          mkdir -p app/src/main/assets/ms
          cp package/dist/cdn/material-symbols-rounded.woff2 app/src/main/assets/ms/
          rm -rf package beer.tgz
          ls -l app/src/main/assets/ms

      - name: Fetch sherpa-onnx
        run: |
          mkdir -p app/libs
          curl -fsSL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.11/sherpa-onnx-1.12.11.aar -o app/libs/sherpa-onnx.aar
          ls -l app/libs

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VideoToNote-Lite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoToNote-Lite
          path: VideoToNote-Lite.apk

      - name: Read version
        id: ver
        run: echo "v=$(grep -rhoP 'versionName "\K[^"]+' --include=build.gradle . | head -n1)" >> "$GITHUB_OUTPUT" || true

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FrameNote v${{ steps.ver.outputs.v }}（第${{ github.run_number }}版）
          files: VideoToNote-Lite.apk
