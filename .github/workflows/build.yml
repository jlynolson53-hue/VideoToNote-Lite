                      runOnUiThread(() -> {
                          try {
                              ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                              if (cb != null && cb.hasPrimaryClip() && cb.getPrimaryClip() != null && cb.getPrimaryClip().getItemCount() > 0) {
                                  CharSequence s = cb.getPrimaryClip().getItemAt(0).coerceToText(MainActivity.this);
                                  if (s != null) out[0] = s.toString();
                              }
                          } catch (Exception e) { }
                          latch.countDown();
                      });
                      try { latch.await(2, java.util.concurrent.TimeUnit.SECONDS); } catch (InterruptedException e) { }
                      return out[0];
                  }

