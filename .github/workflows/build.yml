                log("读取内嵌字幕…");
                try { const r = await ncall("readEmbSub", c.uri, c.subs[0].i); v.segs = r.segs || []; log("内嵌字幕 " + v.segs.length + " 条"); }
                catch (e) { log("内嵌字幕读取失败，改用本机转写：" + e.message); }
              }
              if (!v.segs.length) {
                if (!mst().ok) throw new Error("这个视频没有字幕，需要本机语音转写，但还没导入模型。请在“选择本地视频”下方点“导入模型文件”。");
                log("开始本机离线转写（SenseVoice），不消耗额度…");
                const t0 = Date.now();
                const r = await ncall("asrLocal", c.uri);
                v.segs = (r.segs || []).filter(x => x.text);
                if (!v.segs.length) throw new Error("没有识别出文字（视频可能没有人声）");
                v.asr = true; L.asr = true;
                log("转写完成：" + v.segs.length + " 段，用时 " + Math.round((Date.now() - t0) / 1000) + " 秒", "o");
              }
              if (!v.dur && v.segs.length) v.dur = v.segs[v.segs.length - 1].to;
              return v;
            }
            const _pi = parseInput; parseInput = async function (t) { if (L.cur) return { local: true, p: 1 }; return _pi.apply(this, arguments); };
            const _fs = fetchSubs; fetchSubs = async function (info) { if (info && info.local && L.cur) return localV(); return _fs.apply(this, arguments); };
            if (typeof fetchSubs2 === "function") { const _f2 = fetchSubs2; fetchSubs2 = async function (info) { if (info && info.local && L.cur) return localV(); return _f2.apply(this, arguments); }; }
            const _vu = videoUrl; videoUrl = async function (b) { if (L.cur && b === L.cur.bv) return L.cur.uri; return _vu.apply(this, arguments); };
            const _sh = saveHist; saveHist = function (item) {
              try { if (item && L.cur && item.bvid === L.cur.bv) { item.local = L.cur.uri; item.md = String(item.md || "").replace(/来源：https:\/\/www\.bilibili\.com\/video\/LV\d+\?p=\d+/g, "来源：本地视频《" + L.cur.name + "》"); } } catch (e) {}
              return _sh.apply(this, arguments);
            };
            const _mn = makeNotes; makeNotes = async function (title, segs) {
              if (L.cur && L.asr && segs && segs.length) segs = [{ from: segs[0].from, to: segs[0].from, text: "【说明：以下是本机语音识别的转写稿，可能有同音错字，请结合高中数学、物理、化学、生物术语自动纠正，不要照抄错字】" }].concat(segs);
              return _mn.call(this, title, segs);
            };
            document.addEventListener("click", e => {
              const a = e.target.closest && e.target.closest("#preview a.ts,#preview .shot figcaption.tsj"); if (!a) return;
              try { if (current && current.bvid && /^LV/.test(current.bvid)) { e.preventDefault(); e.stopPropagation(); snack("本地视频的时间跳转下个版本支持"); } } catch (x) {}
            }, true);
          })();
          // v2.3.0：细胞周期进度环（黑白灰）、统计缩成一行
          (function () {
            if (typeof pvDraw !== "function" || !$("progCard")) return;
            const st = document.createElement("style");
            st.textContent =
              "#pvFlow{display:flex!important;justify-content:space-between;gap:4px;margin:6px 0 0!important}#pvFlow .pvS{font-size:12px!important;color:var(--on-surface-variant)!important;flex:1;text-align:center}#pvFlow .pvS i{display:none!important}#pvFlow .pvS.cur{color:var(--on-surface)!important;font-weight:700;animation:none!important}#pvFlow .pvS.done{opacity:.55}" +
              ".pvStats{display:none!important}#pvBar{display:none!important}#pvLine{font-size:13px;color:var(--on-surface-variant);text-align:center;margin:4px 0 8px;font-variant-numeric:tabular-nums}" +
              "#ccBox{display:flex;justify-content:center;margin:6px 0 0}#ccBox svg{width:230px;height:230px;color:var(--on-surface)}" +
              "#ccBox .trk{stroke:var(--fn-line);stroke-width:14;fill:none}#ccBox .arc{stroke:currentColor;stroke-width:14;fill:none;stroke-linecap:butt;transition:stroke-dashoffset .6s ease}" +
              "#ccBox .sep{stroke:var(--surface,#fff);stroke-width:3}#ccBox .lb{font-size:11px;fill:var(--on-surface-variant);text-anchor:middle}#ccBox .lb.on{fill:currentColor;font-weight:700}" +
              "#ccBox .ph{font-size:17px;font-weight:800;fill:currentColor;text-anchor:middle}#ccBox .sub{font-size:11px;fill:var(--on-surface-variant);text-anchor:middle}#ccBox .pc{font-size:26px;font-weight:800;fill:currentColor;text-anchor:middle;font-variant-numeric:tabular-nums}" +
              "#ccBox .cell{fill:var(--surface,#fff);stroke:currentColor;stroke-width:2.5}#ccBox .nuc{fill:#888}" +
              "@media (prefers-reduced-motion:no-preference){#ccBox .live{animation:ccB 1.6s ease-in-out infinite}@keyframes ccB{50%{opacity:.45}}#ccBox .dna{animation:ccD 2.4s linear infinite}@keyframes ccD{to{stroke-dashoffset:-24}}}";
            document.head.appendChild(st);
            const box = document.createElement("div"); box.id = "ccBox";
            const line = document.createElement("div"); line.id = "pvLine";
            $("pvFlow").before(box); $("pvFlow").after(line);
            const R = 92, C = 2 * Math.PI * R, CX = 115, CY = 115;
            // 各相在圆环上的占比（起点在 12 点方向，顺时针）
            const PH = [["G1", 0, .15, "解析视频"], ["S", .15, .5, "复制中 · 取字幕/转写"], ["G2", .5, .65, "检查点 · 截图/识图"], ["M", .65, 1, "分裂中 · 写笔记/汇总"]];
            let best = 0;
            const pt = (f, r) => { const a = f * 2 * Math.PI - Math.PI / 2; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; };
            function frac() {
              const g = PV.stage, ai = PV.aiTotal ? Math.min(1, PV.aiDone / PV.aiTotal) : 0;
              if (g >= 6) return 1;
              if (g === 0) return .07;
              if (g === 1) return .15 + .35 * Math.min(1, PV.sub || 0);
              if (g === 2) return .54;
              if (g === 3) return .58 + .07 * ai;
              if (g === 4) return .65 + .28 * ai;
              return .93 + .06 * ai;
            }
            const _d = pvDraw;
            pvDraw = function () {
              _d.apply(this, arguments);
              try {
                let f = frac(); if (PV.stage === 0 && best > .2) best = 0; best = Math.max(best, f); f = best;
                if (PV.stage === 0 && !PV.done) best = f;
                const ph = PH.find(x => f < x[2]) || PH[3], done = PV.stage >= 6;
                let sep = "", lbs = "";
                PH.forEach(x => { const a = pt(x[1], R - 9), b = pt(x[1], R + 9); sep += '<line class="sep" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>';
                  const m = pt((x[1] + x[2]) / 2, R + 17); lbs += '<text class="lb' + (x === ph && !done ? " on" : "") + '" x="' + m[0] + '" y="' + (m[1] + 4) + '">' + x[0] + "</text>"; });
                const c = pt(f, R);
                let mid;
                const pct = Math.round(f * 100);
                if (done) mid = '<g transform="translate(' + CX + "," + (CY - 6) + ')"><ellipse class="cell" cx="-20" cy="0" rx="17" ry="14"/><circle class="nuc" cx="-20" cy="0" r="5"/><ellipse class="cell" cx="20" cy="0" rx="17" ry="14"/><circle class="nuc" cx="20" cy="0" r="5"/></g><text class="ph" x="' + CX + '" y="' + (CY + 34) + '">分裂完成</text><text class="sub" x="' + CX + '" y="' + (CY + 50) + '">一个变两个 · 笔记已生成</text>';
                else if (ph[0] === "S") mid = '<path class="dna" d="M' + (CX - 30) + " " + (CY - 26) + " q15 10 30 0 t30 0 M" + (CX - 30) + " " + (CY - 16) + ' q15 -10 30 0 t30 0" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 6"/><text class="pc" x="' + CX + '" y="' + (CY + 14) + '">' + pct + '%</text><text class="ph" x="' + CX + '" y="' + (CY + 36) + '" style="font-size:14px">S 期</text><text class="sub" x="' + CX + '" y="' + (CY + 52) + '">' + ph[3] + "</text>";
                else mid = '<text class="pc" x="' + CX + '" y="' + (CY + 2) + '">' + pct + '%</text><text class="ph" x="' + CX + '" y="' + (CY + 26) + '" style="font-size:14px">' + ph[0] + ' 期</text><text class="sub" x="' + CX + '" y="' + (CY + 42) + '">' + ph[3] + "</text>";
                if (PV.paused && !done) mid = '<text class="ph" x="' + CX + '" y="' + (CY - 2) + '">已阻断</text><text class="sub" x="' + CX + '" y="' + (CY + 16) + '">加入阻断剂，停在 ' + ph[0] + ' 期</text><text class="sub" x="' + CX + '" y="' + (CY + 32) + '">点“继续”洗去阻断剂</text>';
                box.innerHTML = '<svg viewBox="0 0 230 230"><circle class="trk" cx="' + CX + '" cy="' + CY + '" r="' + R + '"/><circle class="arc" cx="' + CX + '" cy="' + CY + '" r="' + R + '" transform="rotate(-90 ' + CX + " " + CY + ')" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - f)) + '"/>' + sep + lbs +
                  (done ? "" : '<g class="' + (PV.paused ? "" : "live") + '"><circle class="cell" cx="' + c[0] + '" cy="' + c[1] + '" r="10"/><circle class="nuc" cx="' + c[0] + '" cy="' + c[1] + '" r="3.5"/></g>') + mid + "</svg>";
                line.textContent = "已完成请求 " + (PV.done || 0) + " · 进行中 " + (PV.run || 0) + " · 总进度 " + pct + "%";
                $("pvPct").textContent = pct + "%";
              } catch (e) {}
            };
            const _r = typeof pvReset === "function" ? pvReset : null;
            if (_r) pvReset = function () { best = 0; return _r.apply(this, arguments); };
            try { pvDraw(); } catch (e) {}
          })();
          iconFallback();
          </script>
          </body>
          </html>
          VTN_EOF

      - name: Fetch KaTeX
        run: |
          curl -fsSL https://registry.npmjs.org/katex/-/katex-0.16.11.tgz -o katex.tgz
          tar xzf katex.tgz
          mkdir -p app/src/main/assets/katex
          cp package/dist/katex.min.js package/dist/katex.min.css app/src/main/assets/katex/
          cp -r package/dist/fonts app/src/main/assets/katex/
          rm -rf package katex.tgz
          ls app/src/main/assets/katex

      - name: Fetch Material Symbols (from BeerCSS)
        run: |
          curl -fsSL https://registry.npmjs.org/beercss/-/beercss-5.0.3.tgz -o beer.tgz
          tar xzf beer.tgz
          mkdir -p app/src/main/assets/ms
          cp package/dist/cdn/material-symbols-rounded.woff2 app/src/main/assets/ms/
          rm -rf package beer.tgz
          ls -l app/src/main/assets/ms

      - name: Fetch sherpa-onnx
        run: |
          mkdir -p app/libs
          curl -fsSL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.11/sherpa-onnx-1.12.11.aar -o app/libs/sherpa-onnx.aar
          ls -l app/libs

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VideoToNote-Lite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoToNote-Lite
          path: VideoToNote-Lite.apk

      - name: Read version
        id: ver
        run: echo "v=$(grep -rhoP 'versionName "\K[^"]+' --include=build.gradle . | head -n1)" >> "$GITHUB_OUTPUT" || true

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FrameNote v${{ steps.ver.outputs.v }}（第${{ github.run_number }}版）
          files: VideoToNote-Lite.apk
