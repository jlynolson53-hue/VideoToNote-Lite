                  @JavascriptInterface
                  public void grabFrames(final String id, final String url, final String timesJson, final String prefix) {
                      new Thread(() -> {
                          JSONObject r = new JSONObject();
                          MediaMetadataRetriever mmr = new MediaMetadataRetriever();
                          try {
                              HashMap<String, String> h = new HashMap<>();
                              h.put("User-Agent", UA);
                              h.put("Referer", "https://www.bilibili.com/");
                              prog(id, "正在连接视频流…");
                              mmr.setDataSource(url, h);
                              File dir = new File(getFilesDir(), "img");
                              dir.mkdirs();
                              JSONArray times = new JSONArray(timesJson);
                              JSONArray out = new JSONArray();
                              for (int i = 0; i < times.length(); i++) {
                                  double t = times.getDouble(i);
                                  prog(id, "截图 " + (i + 1) + "/" + times.length());
                                  Bitmap bm = mmr.getFrameAtTime((long) (t * 1000000L), MediaMetadataRetriever.OPTION_CLOSEST_SYNC);
                                  if (bm == null) continue;
                                  int w = bm.getWidth(), hh = bm.getHeight();
                                  if (w > 1280) {
                                      Bitmap s2 = Bitmap.createScaledBitmap(bm, 1280, (int) ((long) hh * 1280 / w), true);
                                      bm.recycle();
                                      bm = s2;
                                  }
                                  String name = prefix + "_" + (int) t + ".jpg";
                                  FileOutputStream fo = new FileOutputStream(new File(dir, name));
                                  bm.compress(Bitmap.CompressFormat.JPEG, 82, fo);
                                  fo.close();
                                  Bitmap th = Bitmap.createScaledBitmap(bm, 32, 18, true);
                                  StringBuilder sb = new StringBuilder();
                                  for (int y = 0; y < 18; y++) {
                                      for (int x = 0; x < 32; x++) {
                                          int c = th.getPixel(x, y);
                                          int g = (((c >> 16) & 255) * 30 + ((c >> 8) & 255) * 59 + (c & 255) * 11) / 100;
                                          sb.append(String.format("%02x", g));
                                      }
                                  }
                                  th.recycle();
                                  bm.recycle();
                                  JSONObject f = new JSONObject();
                                  f.put("t", t);
                                  f.put("name", name);
                                  f.put("thumb", sb.toString());
                                  out.put(f);
                              }
                              r.put("frames", out);
                          } catch (Exception e) {
                              try { r.put("error", "截图失败：" + e); } catch (Exception ignored) { }
                          } finally {
                              try { mmr.release(); } catch (Exception ignored) { }
                          }
                          reply(id, r);
                      }).start();
                  }

