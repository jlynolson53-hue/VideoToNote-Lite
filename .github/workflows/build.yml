                                  android.print.PdfPrint.print(pw.createPrintDocumentAdapter(name), at, out, new android.print.PdfPrint.Cb() {
                                      @Override public void ok(File f) {
                                          JSONObject r = new JSONObject();
                                          try { r.put("msg", saveBytes(name, readFile(f), "application/pdf")); r.put("pages", pages); f.delete(); }
