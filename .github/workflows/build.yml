name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure fixed signing key
        run: |
          if [ ! -f vtn.jks ]; then
            keytool -genkeypair -keystore vtn.jks -storepass vtn123456 -keypass vtn123456 -alias vtn -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=VideoNote"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add vtn.jks
            git commit -m "add fixed signing key"
            git push
          fi

      - name: Write project files
        run: |
          cat > settings.gradle <<'VTN_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VideoToNoteLite"
          include ':app'
          VTN_EOF
          cat > build.gradle <<'VTN_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          VTN_EOF
          cat > gradle.properties <<'VTN_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          VTN_EOF
          mkdir -p app
          cat > app/build.gradle <<'VTN_EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.vtn.lite'
              signingConfigs {
                  debug {
                      storeFile file('../vtn.jks')
                      storePassword 'vtn123456'
                      keyAlias 'vtn'
                      keyPassword 'vtn123456'
                  }
              }
              compileSdk 34
              defaultConfig {
                  applicationId "com.vtn.lite"
                  minSdk 24
                  targetSdk 34
                  versionCode 33
                  versionName "1.7.6"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          VTN_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'VTN_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application
                  android:label="视频笔记"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:label="视频笔记"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
                  <service android:name=".MainActivity$KeepService" android:exported="false" android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          VTN_EOF
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable
          base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png <<'VTN_EOF'
