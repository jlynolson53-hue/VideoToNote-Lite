              private void lvDrain(com.k2fsa.sherpa.onnx.Vad vad, com.k2fsa.sherpa.onnx.OfflineRecognizer rec, JSONArray out) throws Exception {
                  while (!vad.empty()) {
                      com.k2fsa.sherpa.onnx.SpeechSegment sg = vad.front();
                      float[] smp = sg.getSamples(); double st = sg.getStart() / 16000.0;
                      com.k2fsa.sherpa.onnx.OfflineStream os = rec.createStream();
                      os.acceptWaveform(smp, 16000); rec.decode(os);
                      String tx = rec.getResult(os).getText().trim();
                      os.release(); vad.pop();
                      if (tx.length() > 0) { JSONObject o = new JSONObject(); o.put("from", st); o.put("to", st + smp.length / 16000.0); o.put("text", tx); out.put(o); }
                  }
              }

