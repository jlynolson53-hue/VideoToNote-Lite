              @Override
              public void onBackPressed() {
                  String u = web.getUrl();
                  if (u != null && !u.startsWith("file:")) {
                      CookieManager.getInstance().flush();
                      web.loadUrl(HOME);
                      return;
                  }
                  web.evaluateJavascript("(window.__back&&window.__back())?'1':'0'", v -> {
                      if (v == null || !v.contains("1")) super.onBackPressed();
                  });
              }
              private static String readAll(InputStream in) throws Exception {
                  if (in == null) return "";
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                  in.close();
                  return new String(bo.toByteArray(), StandardCharsets.UTF_8);
              }


              // ===== v1.5.5：400 自动重试 + 任务断点文件 =====
              private JSONObject retry400(JSONObject r, String method, String url, String headersJson, String body) {
                  if (!url.contains("/chat/completions") || body == null || body.isEmpty()) return r;
                  StringBuilder note = new StringBuilder();
                  boolean dt = false, dm = false, dh = false;
                  try {
                      String b = body;
                      for (int k = 0; k < 3 && r.optInt("status") == 400; k++) {
                          String err = r.optString("body").toLowerCase();
                          JSONObject j = new JSONObject(b);
                          String fix;
                          if (!dt && err.contains("temperature") && j.has("temperature")) {
                              j.remove("temperature"); dt = true; fix = "去掉 temperature";
                          } else if (!dm && err.contains("max_tokens") && j.has("max_tokens")
                                  && (err.contains("not support") || err.contains("unsupported") || err.contains("max_completion_tokens"))) {
                              j.put("max_completion_tokens", j.get("max_tokens")); j.remove("max_tokens"); dm = true; fix = "改用 max_completion_tokens";
                          } else if (!dh && (err.contains("max_tokens") || err.contains("max_completion_tokens"))) {
                              String key = j.has("max_tokens") ? "max_tokens" : (j.has("max_completion_tokens") ? "max_completion_tokens" : null);
                              if (key == null) break;
                              j.put(key, Math.max(256, j.optInt(key, 4096) / 2)); dh = true; fix = "输出上限减半";
                          } else break;
                          b = j.toString();
                          if (note.length() > 0) note.append("、");
                          note.append(fix);
                          r = doHttp(method, url, headersJson, b);
                      }
                      if (note.length() > 0) r.put("note", note.toString());
                  } catch (Exception ignored) { }
                  return r;
              }

              private static String safe(String n) { return n.replaceAll("[^A-Za-z0-9_.\\-]", "_"); }
              private File taskDir(String id) { File d = new File(new File(getFilesDir(), "task"), safe(id)); d.mkdirs(); return d; }

              private JSONObject doHttp(String method, String url, String headersJson, String body) {
                  JSONObject r = new JSONObject();
                  try {
                      HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                      c.setRequestMethod(method);
                      c.setConnectTimeout(20000);
                      c.setReadTimeout(300000);
                      c.setInstanceFollowRedirects(true);
                      if (headersJson != null && headersJson.length() > 0) {
                          JSONObject h = new JSONObject(headersJson);
                          Iterator<String> it = h.keys();
                          while (it.hasNext()) {
                              String k = it.next();
                              c.setRequestProperty(k, h.getString(k));
                          }
                      }
                      if (url.contains("bilibili.com")) {
                          String ck = CookieManager.getInstance().getCookie(url);
                          if (ck != null) c.setRequestProperty("Cookie", ck);
                      }
                      if (body != null && body.length() > 0) {
                          c.setDoOutput(true);
                          OutputStream o = c.getOutputStream();
                          o.write(body.getBytes(StandardCharsets.UTF_8));
                          o.close();
                      }
                      int code = c.getResponseCode();
                      InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                      r.put("status", code);
                      r.put("body", readAll(in));
                      r.put("url", c.getURL().toString());
                  } catch (Exception e) {
                      try { r.put("error", e.toString()); } catch (Exception ignored) { }
                  }
                  return r;
              }


              static final String UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36";

              private void prog(String id, String msg) {
