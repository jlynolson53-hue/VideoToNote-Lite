          package android.print;

          import android.os.CancellationSignal;
          import android.os.ParcelFileDescriptor;
          import java.io.File;

          // v1.8.7：不经过系统打印界面，直接把 WebView 写成 PDF
          public class PdfPrint {
              public interface Cb { void ok(File f); void err(String e); }
              public static void print(final PrintDocumentAdapter ad, final PrintAttributes attr, final File out, final Cb cb) {
                  ad.onLayout(null, attr, null, new PrintDocumentAdapter.LayoutResultCallback() {
                      @Override public void onLayoutFinished(PrintDocumentInfo info, boolean changed) {
                          try {
                              final ParcelFileDescriptor fd = ParcelFileDescriptor.open(out,
                                  ParcelFileDescriptor.MODE_CREATE | ParcelFileDescriptor.MODE_TRUNCATE | ParcelFileDescriptor.MODE_READ_WRITE);
                              ad.onWrite(new PageRange[]{ PageRange.ALL_PAGES }, fd, new CancellationSignal(), new PrintDocumentAdapter.WriteResultCallback() {
                                  @Override public void onWriteFinished(PageRange[] pages) { try { fd.close(); } catch (Exception ignored) { } cb.ok(out); }
                                  @Override public void onWriteFailed(CharSequence e) { try { fd.close(); } catch (Exception ignored) { } cb.err(String.valueOf(e)); }
                              });
                          } catch (Exception e) { cb.err(e.toString()); }
                      }
                      @Override public void onLayoutFailed(CharSequence e) { cb.err(String.valueOf(e)); }
                  }, null);
              }
          }
          VTN_EOF
