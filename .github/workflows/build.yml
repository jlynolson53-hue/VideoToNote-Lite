                              final String js = "alert(" + JSONObject.quote("打开系统打印失败：" + e) + ")";
                              web.evaluateJavascript(js, null);
                          }
                      });
                      return "ok";
                  }

                  @JavascriptInterface
                  public void setBars(final String color, final boolean light) {
                      runOnUiThread(() -> {
                          try {
                              int c = android.graphics.Color.parseColor(color);
                              getWindow().setStatusBarColor(c);
                              getWindow().setNavigationBarColor(c);
                              int f = getWindow().getDecorView().getSystemUiVisibility();
                              if (light) {
                                  f |= android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                                  if (Build.VERSION.SDK_INT >= 26) f |= android.view.View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                              } else {
                                  f &= ~android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                                  if (Build.VERSION.SDK_INT >= 26) f &= ~android.view.View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                              }
                              getWindow().getDecorView().setSystemUiVisibility(f);
                          } catch (Exception ignored) { }
                      });
                  }

                  @JavascriptInterface
                  public String filesDir() {
                      return getFilesDir().getAbsolutePath();
                  }

                  @JavascriptInterface
                  public String readB64(String name) {
                      try {
                          return Base64.encodeToString(readFile(new File(new File(getFilesDir(), "img"), name)), Base64.NO_WRAP);
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public void grabFrames(final String id, final String url, final String timesJson, final String prefix) {
                      new Thread(() -> {
                          JSONObject r = new JSONObject();
                          MediaMetadataRetriever mmr = new MediaMetadataRetriever();
                          try {
                              HashMap<String, String> h = new HashMap<>();
                              h.put("User-Agent", UA);
                              h.put("Referer", "https://www.bilibili.com/");
                              prog(id, "正在连接视频流…");
                              mmr.setDataSource(url, h);
                              File dir = new File(getFilesDir(), "img");
                              dir.mkdirs();
                              JSONArray times = new JSONArray(timesJson);
                              JSONArray out = new JSONArray();
                              for (int i = 0; i < times.length(); i++) {
                                  double t = times.getDouble(i);
                                  prog(id, "截图 " + (i + 1) + "/" + times.length());
                                  Bitmap bm = mmr.getFrameAtTime((long) (t * 1000000L), MediaMetadataRetriever.OPTION_CLOSEST_SYNC);
                                  if (bm == null) continue;
                                  int w = bm.getWidth(), hh = bm.getHeight();
                                  if (w > 1280) {
                                      Bitmap s2 = Bitmap.createScaledBitmap(bm, 1280, (int) ((long) hh * 1280 / w), true);
                                      bm.recycle();
                                      bm = s2;
                                  }
                                  String name = prefix + "_" + (int) t + ".jpg";
                                  FileOutputStream fo = new FileOutputStream(new File(dir, name));
                                  bm.compress(Bitmap.CompressFormat.JPEG, 82, fo);
                                  fo.close();
                                  Bitmap th = Bitmap.createScaledBitmap(bm, 32, 18, true);
                                  StringBuilder sb = new StringBuilder();
                                  for (int y = 0; y < 18; y++) {
                                      for (int x = 0; x < 32; x++) {
                                          int c = th.getPixel(x, y);
                                          int g = (((c >> 16) & 255) * 30 + ((c >> 8) & 255) * 59 + (c & 255) * 11) / 100;
                                          sb.append(String.format("%02x", g));
                                      }
                                  }
                                  th.recycle();
                                  bm.recycle();
                                  JSONObject f = new JSONObject();
                                  f.put("t", t);
                                  f.put("name", name);
                                  f.put("thumb", sb.toString());
                                  out.put(f);
                              }
                              r.put("frames", out);
                          } catch (Exception e) {
                              try { r.put("error", "截图失败：" + e); } catch (Exception ignored) { }
                          } finally {
                              try { mmr.release(); } catch (Exception ignored) { }
                          }
                          reply(id, r);
                      }).start();
                  }

                  @JavascriptInterface
                  public int exportImages(String namesJson) {
                      int n = 0;
                      try {
                          JSONArray a = new JSONArray(namesJson);
                          File dir = new File(getFilesDir(), "img");
                          for (int i = 0; i < a.length(); i++) {
                              String name = a.getString(i);
                              File src = new File(dir, name);
                              if (!src.exists()) continue;
                              byte[] data = readFile(src);
                              if (Build.VERSION.SDK_INT >= 29) {
                                  ContentValues v = new ContentValues();
                                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                                  v.put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg");
                                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/VideoToNote/img");
                                  Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                                  OutputStream o = getContentResolver().openOutputStream(u);
                                  o.write(data);
                                  o.close();
                              } else {
                                  File d2 = new File(getExternalFilesDir(null), "img");
                                  d2.mkdirs();
                                  FileOutputStream o = new FileOutputStream(new File(d2, name));
                                  o.write(data);
                                  o.close();
                              }
                              n++;
                          }
                      } catch (Exception ignored) { }
                      return n;
                  }

                  @JavascriptInterface
                  public void transcribe(final String id, final String audioUrl, final String key, final String model, final int chunkSec) {
                      new Thread(() -> {
                          JSONObject r = new JSONObject();
                          File cache = new File(getCacheDir(), "audio.m4s");
                          ArrayList<File> files = new ArrayList<>();
                          try {
                              prog(id, "正在下载音频…");
                              HttpURLConnection c = (HttpURLConnection) new URL(audioUrl).openConnection();
                              c.setConnectTimeout(20000);
                              c.setReadTimeout(120000);
                              c.setRequestProperty("User-Agent", UA);
                              c.setRequestProperty("Referer", "https://www.bilibili.com/");
                              int code = c.getResponseCode();
                              if (code >= 400) throw new Exception("音频下载失败（状态码 " + code + "）");
                              InputStream in = c.getInputStream();
                              FileOutputStream fo = new FileOutputStream(cache);
                              byte[] buf0 = new byte[65536];
                              long total = 0, nextReport = 2L << 20;
                              int n;
                              while ((n = in.read(buf0)) > 0) {
                                  fo.write(buf0, 0, n);
                                  total += n;
                                  if (total >= nextReport) {
                                      prog(id, "已下载音频 " + (total >> 20) + " MB");
                                      nextReport += 2L << 20;
                                  }
                              }
                              fo.close();
                              in.close();

                              prog(id, "正在切分音频…");
                              MediaExtractor ex = new MediaExtractor();
                              ex.setDataSource(cache.getAbsolutePath());
                              int tr = -1;
                              MediaFormat fmt = null;
                              for (int i = 0; i < ex.getTrackCount(); i++) {
                                  MediaFormat f = ex.getTrackFormat(i);
                                  String m = f.getString(MediaFormat.KEY_MIME);
                                  if (m != null && m.startsWith("audio/")) { tr = i; fmt = f; break; }
                              }
                              if (tr < 0) throw new Exception("音频里没有找到音轨");
                              ex.selectTrack(tr);
                              ByteBuffer buf = ByteBuffer.allocate(1 << 20);
                              MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();
                              MediaMuxer mux = null;
                              int mt = -1;
                              long first = 0, lastT = 0, chunkUs = chunkSec * 1000000L;
                              ArrayList<Double> starts = new ArrayList<>();
                              ArrayList<Double> ends = new ArrayList<>();
                              while (true) {
                                  int size = ex.readSampleData(buf, 0);
                                  if (size < 0) break;
                                  long t = ex.getSampleTime();
                                  if (mux == null || t - first >= chunkUs) {
                                      if (mux != null) { mux.stop(); mux.release(); ends.add(lastT / 1e6); }
                                      File cf = new File(getCacheDir(), "asr_" + files.size() + ".m4a");
                                      mux = new MediaMuxer(cf.getAbsolutePath(), MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                                      mt = mux.addTrack(fmt);
                                      mux.start();
                                      first = t;
                                      files.add(cf);
                                      starts.add(t / 1e6);
                                  }
                                  info.set(0, size, t - first, MediaCodec.BUFFER_FLAG_KEY_FRAME);
                                  mux.writeSampleData(mt, buf, info);
                                  lastT = t;
                                  ex.advance();
                              }
                              if (mux != null) { mux.stop(); mux.release(); ends.add(lastT / 1e6); }
                              ex.release();
                              if (files.isEmpty()) throw new Exception("音频是空的");

                              JSONArray segs = new JSONArray();
                              for (int i = 0; i < files.size(); i++) {
                                  prog(id, "语音识别 " + (i + 1) + "/" + files.size() + " …");
                                  String txt = null;
                                  Exception last = null;
                                  for (int k = 0; k < 3 && txt == null; k++) {
                                      try { txt = uploadAsr(files.get(i), key, model); }
                                      catch (Exception e) {
                                          last = e;
                                          if (String.valueOf(e.getMessage()).contains("Key")) break;
                                          try { Thread.sleep(2000L * (k + 1)); } catch (Exception ignored) { }
                                      }
                                  }
                                  if (txt == null) throw last;
                                  JSONObject s = new JSONObject();
                                  s.put("from", starts.get(i));
                                  s.put("to", ends.get(i));
                                  s.put("text", txt);
                                  segs.put(s);
                              }
                              r.put("segs", segs);
                          } catch (Exception e) {
                              try { r.put("error", e.getMessage() == null ? e.toString() : e.getMessage()); } catch (Exception ignored) { }
                          } finally {
                              cache.delete();
                              for (File f : files) f.delete();
                          }
                          reply(id, r);
                      }).start();
                  }
              }
          }
