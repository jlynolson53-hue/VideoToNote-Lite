                <button class="icon" id="pasteBtn" title="粘贴"><i class="ic" data-fb="粘贴">content_paste</i></button></div>
              <label>分P（留空=自动识别）</label><input id="pnum" type="number" min="1" placeholder="自动" style="max-width:200px">
              <select id="style" style="display:none"><option value="study">教辅模式</option><option value="brief">简要摘要</option><option value="detail">详细逐段</option></select>
              <label>笔记风格</label><div class="chips" id="styleChips"></div>
              <label>选项</label><div class="chips"><button class="chip5" id="chipTs">显示时间戳</button><button class="chip5" id="chipShot">截图笔记</button></div>
              <label class="sw" style="display:none"><span>笔记中显示时间戳<small id="tsTip"></small></span><input type="checkbox" id="tsOn"><i></i></label>
              <details class="req" id="reqBox">
                <summary>我的要求<em id="reqOn"></em><label class="sw rsw" id="reqSw" title="启用/关闭我的要求"><input type="checkbox" id="reqEn"><i></i></label></summary>
                <textarea id="req" placeholder="例如：这是高三物理复习课，重点整理解题方法；每个知识点后面列出易错点；最后出3道自测题。"></textarea>
                <div class="pills" id="pills">
                  <button>标出高考考点</button><button>列出易错点</button><button>例题写完整解题步骤</button>
                  <button>保留老师的口诀和技巧</button><button>相似概念用表格对比</button><button>末尾出3道自测题（附答案）</button>
                  <button>语言尽量简洁</button>
                </div>
                <button class="text" id="reqClear">清空</button>
                <div class="mute" style="margin-bottom:8px">点上面的芯片可以快速添加。内容自动保存，以后每次生成都会用上。</div>
